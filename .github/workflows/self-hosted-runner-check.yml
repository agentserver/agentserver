name: Self-hosted Runner Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-runner-check
  cancel-in-progress: true

jobs:
  v2-check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: k8s-sg
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make

      - name: Verify runner Docker access
        run: docker version

      - uses: actions/setup-go@v6
        with:
          go-version-file: v2/go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Verify v2 module boundary and unit tests
        run: make -C v2 check
