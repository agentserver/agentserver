    },
    "responses": {
      "CommandError": {
        "description": "Stable command rejection",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}
      }
    },
    "schemas": {
      "UUID": {"type": "string", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", "not": {"const": "00000000-0000-0000-0000-000000000000"}},
      "SHA256": {"type": "string", "pattern": "^[0-9a-f]{64}$"},
      "ExecutorResourceState": {
        "type": "object", "additionalProperties": false,
        "required": ["executorId", "workspaceId", "status", "version", "createdAt", "updatedAt"],
        "properties": {
          "executorId": {"$ref": "#/components/schemas/UUID"},
          "workspaceId": {"$ref": "#/components/schemas/UUID"},
          "status": {"enum": ["enrolling", "offline", "online", "revoked"]},
          "version": {"type": "integer", "minimum": 1, "maximum": 9007199254740991},
          "createdAt": {"type": "string", "format": "date-time"},
          "updatedAt": {"type": "string", "format": "date-time"}
        }
      },
      "ExecutorEnrollmentEnvironment": {
        "type": "object", "additionalProperties": false,
        "required": ["envId", "platform", "codexRelease", "codexCommit", "codexSha256", "outerProfileVersion", "processMethods", "insecureDev", "rootDescriptor", "ownerPolicySha256"],
        "properties": {
          "envId": {"$ref": "#/components/schemas/UUID"},
          "platform": {"enum": ["linux-amd64", "linux-arm64", "darwin-amd64", "darwin-arm64", "windows-amd64", "windows-arm64"]},
          "codexRelease": {"type": "string", "minLength": 1, "maxLength": 128},
          "codexCommit": {"type": "string", "pattern": "^[0-9a-f]{40}$"},
          "codexSha256": {"$ref": "#/components/schemas/SHA256"},
          "outerProfileVersion": {"enum": ["process-v1", "process-v1+filesystem-read-v1"]},
          "processMethods": {"$ref": "#/components/schemas/ProcessMethods"},
          "insecureDev": {"const": false},
          "rootDescriptor": {"type": "object", "maxProperties": 256, "x-agentserver-maxBytes": 65536},
          "ownerPolicySha256": {"$ref": "#/components/schemas/SHA256"}
        }
      },
