name: Publish v2 Production Artifacts

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-production.yml"
  workflow_dispatch:
    inputs:
      release_mode:
        description: Full artifact build, fail-closed bootstrap transition, or developer service-only release
        required: false
        default: service_only
        type: choice
        options:
          - full
          - bootstrap
          - service_only
      active_chart_only:
        description: Publish the image-locked active or fail-closed bootstrap Chart without rebuilding images
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: v2-production-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVICE_REPOSITORY: ghcr.io/agentserver/v2-service
  HARNESS_REPOSITORY: ghcr.io/agentserver/v2-harness
  MANAGED_SANDBOX_REPOSITORY: ghcr.io/agentserver/v2-managed-sandbox
  HYDRA_REPOSITORY: ghcr.io/agentserver/hydra
  CHART_REPOSITORY: ghcr.io/agentserver/agentserver-v2
  CODEX_URL: https://github.com/openai/codex/releases/download/rust-v0.146.0/codex-x86_64-unknown-linux-musl.tar.gz
  CODEX_ARCHIVE_SHA256: 5ba3b9405543953081f661d0854d266f76e2abbe51d41349355a36de7673776a
  BWRAP_URL: https://github.com/openai/codex/releases/download/rust-v0.146.0/bwrap-x86_64-unknown-linux-musl.tar.gz
  BWRAP_ARCHIVE_SHA256: debe6f23b085976553083e2a3090156f6e38bdc0f44245f4ee904fb515b8b4fe
  LARK_CLI_URL: https://github.com/larksuite/cli/releases/download/v1.0.69/lark-cli-1.0.69-linux-amd64.tar.gz
  LARK_CLI_ARCHIVE_SHA256: 224e1f8c04bb194d668c750928c5b2f4942bbffd62a118c3dc163f27ee6e5c09
  LARK_CLI_SHA256: faee6cf3f4d87194e079820ff7809182cbda1d815bc902700649c737ac0ed943
  LARK_SKILL_SHA256: 3c03773ac40132e68c406c715d69847c1f60f10e00982bac9782d7bc5ac8bd29
  MANAGED_SKILL_SHA256: 1c4f715f2a374b51085736f3e43b137a3ce6b42851c075746b4b83953f864a99
  BKECTL_REPOSITORY: https://code.byted.org/bd-sre/bkectl.git
  BKECTL_SOURCE_REVISION: 300680a39abf576b69d989d9950dfce0067fce83
  HYDRA_SOURCE: docker.io/oryd/hydra@sha256:f59c2f7f4969269b154fa34c57bc4b849263ebedbcaf8114aaeb1658a3007b4b
  HYDRA_DIGEST: sha256:f59c2f7f4969269b154fa34c57bc4b849263ebedbcaf8114aaeb1658a3007b4b

jobs:
  frontend:
    if: ${{ !inputs.active_chart_only }}
    uses: ./.github/workflows/dsh-frontend.yml
  publish-linux-amd64:
    needs: frontend
    if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.active_chart_only && (inputs.release_mode == 'full' || inputs.release_mode == 'bootstrap')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full release]')) }}
    runs-on: k8s-sg
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: dsh-frontend
          path: v2/dsh-web/dist

      - name: Install build and OCI copy tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1 make skopeo

      - uses: actions/setup-go@v6
        with:
          go-version-file: v2/go.mod
          # The GitHub Actions cache data plane is unreachable from ephemeral
          # k8s-sg runners: restores remain at 0 B/s and block releases. Fetch
          # only the dependencies required by this reproducible build.
          cache: false

      - name: Configure code.byted.org read access
        env:
          CODE_BYTED_USERNAME: ${{ secrets.CODE_BYTED_USERNAME }}
          CODE_BYTED_TOKEN: ${{ secrets.CODE_BYTED_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CODE_BYTED_USERNAME}" && test -n "${CODE_BYTED_TOKEN}" || {
            echo 'CODE_BYTED_USERNAME and CODE_BYTED_TOKEN Actions secrets are required' >&2
            exit 1
          }
          credential_file="${RUNNER_TEMP}/code-byted.credentials"
          umask 077
          git config --global credential.helper "store --file=${credential_file}"
          printf 'protocol=https\nhost=code.byted.org\nusername=%s\npassword=%s\n\n' \
            "${CODE_BYTED_USERNAME}" "${CODE_BYTED_TOKEN}" | git credential approve
          printf '%s\n' \
            'GIT_TERMINAL_PROMPT=0' \
            'GOPRIVATE=code.byted.org' \
            'GONOSUMDB=code.byted.org' >>"${GITHUB_ENV}"
          GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code \
            https://code.byted.org/security/zti-jwt-golang.git HEAD >/dev/null

      - name: Check out pinned bkectl source
        id: bkectl_source
        run: |
          set -euo pipefail
          checkout="${RUNNER_TEMP}/agentserver-bkectl-source"
          git init "${checkout}"
          git -C "${checkout}" remote add origin "${BKECTL_REPOSITORY}"
          GIT_TERMINAL_PROMPT=0 git -C "${checkout}" fetch --depth=1 origin "${BKECTL_SOURCE_REVISION}"
          git -C "${checkout}" checkout --detach FETCH_HEAD
          test "$(git -C "${checkout}" rev-parse HEAD)" = "${BKECTL_SOURCE_REVISION}"
          test -z "$(git -C "${checkout}" status --short)"
          printf 'checkout=%s\n' "${checkout}" >>"${GITHUB_OUTPUT}"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: v2/.node-version

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Verify source before publishing
        run: |
          set -euo pipefail
          export AGENTSERVER_REQUIRE_DSH_ASSETS=1
          export AGENTSERVER_REQUIRE_PLATFORM_ASSETS=1
          pnpm --dir v2 install --frozen-lockfile
          pnpm --dir v2 web:check
          make -C v2 check
          git diff --exit-code -- v2/web-shared/src/generated

      - name: Download and verify pinned runtime artifacts
        id: runtime
        run: |
          set -euo pipefail
          runtime_dir="${RUNNER_TEMP}/agentserver-stock-runtime"
          install -d -m 0700 \
            "${runtime_dir}/codex-unpacked" \
            "${runtime_dir}/bwrap-unpacked" \
            "${runtime_dir}/lark-cli-unpacked"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            "${CODEX_URL}" --output "${runtime_dir}/codex.tar.gz"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            "${BWRAP_URL}" --output "${runtime_dir}/bwrap.tar.gz"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            "${LARK_CLI_URL}" --output "${runtime_dir}/lark-cli.tar.gz"
          tar --extract --gzip --file "${runtime_dir}/codex.tar.gz" --directory "${runtime_dir}/codex-unpacked" --no-same-owner
          tar --extract --gzip --file "${runtime_dir}/bwrap.tar.gz" --directory "${runtime_dir}/bwrap-unpacked" --no-same-owner
          tar --extract --gzip --file "${runtime_dir}/lark-cli.tar.gz" --directory "${runtime_dir}/lark-cli-unpacked" --no-same-owner
          codex_source=$(find "${runtime_dir}/codex-unpacked" -type f -name 'codex-x86_64-unknown-linux-musl' -print)
          bwrap_source=$(find "${runtime_dir}/bwrap-unpacked" -type f -name 'bwrap-x86_64-unknown-linux-musl' -print)
          lark_cli_source=$(find "${runtime_dir}/lark-cli-unpacked" -type f -name 'lark-cli' -print)
          test -n "${codex_source}" && test "${codex_source}" = "$(printf '%s' "${codex_source}" | head -n 1)"
          test -n "${bwrap_source}" && test "${bwrap_source}" = "$(printf '%s' "${bwrap_source}" | head -n 1)"
          test -n "${lark_cli_source}" && test "${lark_cli_source}" = "$(printf '%s' "${lark_cli_source}" | head -n 1)"
          install -m 0555 "${codex_source}" "${runtime_dir}/codex"
          install -m 0555 "${bwrap_source}" "${runtime_dir}/bwrap"
          install -m 0555 "${lark_cli_source}" "${runtime_dir}/lark-cli"
          test "$(stat --format=%s "${runtime_dir}/codex")" = '311001136'
          test "$(stat --format=%s "${runtime_dir}/bwrap")" = '529776'
          test "$(stat --format=%s "${runtime_dir}/lark-cli")" = '42463384'
          test "$("${runtime_dir}/lark-cli" --version)" = 'lark-cli version 1.0.69'
          printf 'codex=%s\n' "${runtime_dir}/codex" >>"${GITHUB_OUTPUT}"
          printf 'bwrap=%s\n' "${runtime_dir}/bwrap" >>"${GITHUB_OUTPUT}"
          printf 'lark_cli=%s\n' "${runtime_dir}/lark-cli" >>"${GITHUB_OUTPUT}"
          printf 'lark_skill=%s\n' "${GITHUB_WORKSPACE}/v2/deploy/production/lark-readonly.SKILL.md" >>"${GITHUB_OUTPUT}"

      - name: Build and verify pinned bkectl runtime
        id: bkectl
        env:
          BKECTL_CHECKOUT: ${{ steps.bkectl_source.outputs.checkout }}
        run: |
          set -euo pipefail
          runtime_dir="${RUNNER_TEMP}/agentserver-bkectl-runtime"
          install -d -m 0700 "${runtime_dir}"
          env \
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            GOCACHE="${RUNNER_TEMP}/agentserver-bkectl-gocache" \
            GOMODCACHE="${RUNNER_TEMP}/agentserver-bkectl-gomodcache" \
            go -C "${BKECTL_CHECKOUT}/src" build \
              -buildvcs=false -trimpath \
              -ldflags="-s -w -buildid= -X code.byted.org/bd-sre/bkectl/src/pkg/buildinfo.Version=${BKECTL_SOURCE_REVISION} -X code.byted.org/bd-sre/bkectl/src/pkg/buildinfo.BuildTime=1970-01-01T00:00:00Z" \
              -o "${runtime_dir}/bkectl" ./cmd/bkectl
          chmod 0555 "${runtime_dir}/bkectl"
          version_json=$("${runtime_dir}/bkectl" --json version)
          if ! jq -e \
            --arg version "${BKECTL_SOURCE_REVISION}" \
            --arg build_time '1970-01-01T00:00:00Z' \
            '.success == true and .data.version == $version and .data.build_time == $build_time' \
            <<<"${version_json}" >/dev/null; then
            printf 'bkectl version contract mismatch: expected version=%s build_time=%s; response=%s\n' \
              "${BKECTL_SOURCE_REVISION}" '1970-01-01T00:00:00Z' "${version_json}" >&2
            exit 1
          fi
          skill_root="${BKECTL_CHECKOUT}/skills/bkectl"
          test "$(find "${skill_root}" -type f | wc -l | tr -d '[:space:]')" = '4'
          printf 'binary=%s\n' "${runtime_dir}/bkectl" >>"${GITHUB_OUTPUT}"
          printf 'skill_root=%s\n' "${skill_root}" >>"${GITHUB_OUTPUT}"
          printf 'managed_skill=%s\n' "${GITHUB_WORKSPACE}/v2/deploy/production/managed-cli-readonly.SKILL.md" >>"${GITHUB_OUTPUT}"

      - name: Build and verify closed-world OCI images
        env:
          CODEX_PATH: ${{ steps.runtime.outputs.codex }}
          BWRAP_PATH: ${{ steps.runtime.outputs.bwrap }}
          LARK_CLI_PATH: ${{ steps.runtime.outputs.lark_cli }}
          LARK_SKILL_PATH: ${{ steps.runtime.outputs.lark_skill }}
          BKECTL_PATH: ${{ steps.bkectl.outputs.binary }}
          BKECTL_SKILL_ROOT: ${{ steps.bkectl.outputs.skill_root }}
          MANAGED_SKILL_PATH: ${{ steps.bkectl.outputs.managed_skill }}
        run: |
          set -euo pipefail
          build_log="${RUNNER_TEMP}/agentserver-v2-image-build.log"
          if ! ./v2/deploy/production/build-images.sh \
              --platform=linux-amd64 \
              --codex="${CODEX_PATH}" \
              --bwrap="${BWRAP_PATH}" \
              --lark-cli="${LARK_CLI_PATH}" \
              --lark-skill="${LARK_SKILL_PATH}" \
              --bkectl="${BKECTL_PATH}" \
              --bkectl-skill-root="${BKECTL_SKILL_ROOT}" \
              --managed-skill="${MANAGED_SKILL_PATH}" \
              --service-image="${SERVICE_REPOSITORY}:sha-${GITHUB_SHA}" \
              --harness-image="${HARNESS_REPOSITORY}:sha-${GITHUB_SHA}" \
              --managed-sandbox-image="${MANAGED_SANDBOX_REPOSITORY}:sha-${GITHUB_SHA}" \
              --engine=docker-buildx \
              --output-dir="${RUNNER_TEMP}/agentserver-v2-image-evidence" \
              2>&1 | tee "${build_log}"; then
            {
              printf '### Closed-world OCI image build failed\n\n```text\n'
              tail -n 80 "${build_log}"
              printf '```\n'
            } >>"${GITHUB_STEP_SUMMARY}"
            diagnostic=$(tail -n 1 "${build_log}")
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=Closed-world OCI image build failed::%s\n' "${diagnostic}"
            exit 1
          fi

      - name: Publish verified images and mirror Hydra
        id: images
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/agentserver-v2-image-evidence"
          service_tag="${SERVICE_REPOSITORY}:sha-${GITHUB_SHA}"
          harness_tag="${HARNESS_REPOSITORY}:sha-${GITHUB_SHA}"
          managed_sandbox_tag="${MANAGED_SANDBOX_REPOSITORY}:sha-${GITHUB_SHA}"
          skopeo_retry=(--retry-times 10)
          skopeo copy "${skopeo_retry[@]}" \
            "oci-archive:${evidence}/service-image.oci.tar" "docker://${service_tag}"
          skopeo copy "${skopeo_retry[@]}" \
            "oci-archive:${evidence}/harness-image.oci.tar" "docker://${harness_tag}"
          skopeo copy "${skopeo_retry[@]}" \
            "oci-archive:${evidence}/managed-sandbox-image.oci.tar" "docker://${managed_sandbox_tag}"
          # Push the convenience tags from the already-verified local archives.
          # Reading a just-created private GHCR manifest back by digest can race
          # package visibility and return a non-retryable 403 even though the
          # authenticated tag inspect and both destination pushes succeeded.
          skopeo copy "${skopeo_retry[@]}" \
            "oci-archive:${evidence}/service-image.oci.tar" "docker://${SERVICE_REPOSITORY}:main"
          skopeo copy "${skopeo_retry[@]}" \
            "oci-archive:${evidence}/harness-image.oci.tar" "docker://${HARNESS_REPOSITORY}:main"
          skopeo copy "${skopeo_retry[@]}" \
            "oci-archive:${evidence}/managed-sandbox-image.oci.tar" "docker://${MANAGED_SANDBOX_REPOSITORY}:main"
          skopeo copy "${skopeo_retry[@]}" --override-os linux --override-arch amd64 \
            "docker://${HYDRA_SOURCE}" "docker://${HYDRA_REPOSITORY}:26.2.0-amd64"
          service_digest=$(skopeo inspect "${skopeo_retry[@]}" --format '{{.Digest}}' "docker://${service_tag}")
          harness_digest=$(skopeo inspect "${skopeo_retry[@]}" --format '{{.Digest}}' "docker://${harness_tag}")
          managed_sandbox_digest=$(skopeo inspect "${skopeo_retry[@]}" --format '{{.Digest}}' "docker://${managed_sandbox_tag}")
          hydra_digest=$(skopeo inspect "${skopeo_retry[@]}" --format '{{.Digest}}' "docker://${HYDRA_REPOSITORY}:26.2.0-amd64")
          managed_sandbox_tae_tag="sha256-${managed_sandbox_digest#sha256:}"
          test "${#managed_sandbox_tae_tag}" = '71'
          # TAE currently rejects OCI @sha256 references and accepts only a
          # registry/repository:tag image. Publish a deterministic tag that
          # embeds the complete manifest digest, then prove the mapping before
          # allowing the release to advance.
          skopeo copy "${skopeo_retry[@]}" \
            "oci-archive:${evidence}/managed-sandbox-image.oci.tar" \
            "docker://${MANAGED_SANDBOX_REPOSITORY}:${managed_sandbox_tae_tag}"
          test "$(skopeo inspect "${skopeo_retry[@]}" --format '{{.Digest}}' \
            "docker://${MANAGED_SANDBOX_REPOSITORY}:${managed_sandbox_tae_tag}")" = "${managed_sandbox_digest}"
          test "$(skopeo inspect "${skopeo_retry[@]}" --format '{{.Os}}/{{.Architecture}}' "docker://${service_tag}")" = 'linux/amd64'
          test "$(skopeo inspect "${skopeo_retry[@]}" --format '{{.Os}}/{{.Architecture}}' "docker://${harness_tag}")" = 'linux/amd64'
          test "$(skopeo inspect "${skopeo_retry[@]}" --format '{{.Os}}/{{.Architecture}}' "docker://${managed_sandbox_tag}")" = 'linux/amd64'
          test "$(skopeo inspect "${skopeo_retry[@]}" --format '{{.Os}}/{{.Architecture}}' "docker://${HYDRA_REPOSITORY}:26.2.0-amd64")" = 'linux/amd64'
          test "${hydra_digest}" = "${HYDRA_DIGEST}"
          printf 'service_digest=%s\n' "${service_digest}" >>"${GITHUB_OUTPUT}"
          printf 'harness_digest=%s\n' "${harness_digest}" >>"${GITHUB_OUTPUT}"
          printf 'managed_sandbox_digest=%s\n' "${managed_sandbox_digest}" >>"${GITHUB_OUTPUT}"
          printf 'managed_sandbox_tae_tag=%s\n' "${managed_sandbox_tae_tag}" >>"${GITHUB_OUTPUT}"
          printf 'hydra_digest=%s\n' "${hydra_digest}" >>"${GITHUB_OUTPUT}"

      - name: Generate and publish environment-locked Helm chart
        id: chart
        env:
          SERVICE_DIGEST: ${{ steps.images.outputs.service_digest }}
          HARNESS_DIGEST: ${{ steps.images.outputs.harness_digest }}
          MANAGED_SANDBOX_DIGEST: ${{ steps.images.outputs.managed_sandbox_digest }}
          PUBLISHED_HYDRA_DIGEST: ${{ steps.images.outputs.hydra_digest }}
          SG_PRODUCTION_CONFIG_B64: ${{ secrets.V2_SG_PRODUCTION_CONFIG_B64 }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/agentserver-v2-release"
          chart_dir="${release_dir}/agentserver-v2"
          install -d -m 0700 "${release_dir}"
          # The checked-in config.example.json is deliberately a renderer
          # fixture. A Chart may only be promoted from the separately
          # provisioned, evidence-backed SG configuration secret. Keep the
          # decoded file owner-readable and never echo its contents.
          if [ -z "${SG_PRODUCTION_CONFIG_B64:-}" ]; then
            echo 'V2_SG_PRODUCTION_CONFIG_B64 is required to publish a production Chart (images were published; Chart promotion is blocked)' >&2
            exit 1
          fi
          umask 077
          production_template="${release_dir}/sg-production-template.json"
          if ! printf '%s' "${SG_PRODUCTION_CONFIG_B64}" | base64 --decode >"${production_template}"; then
            echo 'V2_SG_PRODUCTION_CONFIG_B64 is not valid base64' >&2
            exit 1
          fi
          chmod 0600 "${production_template}"
          go -C v2 run ./cmd/agentserver-deploy validate \
            --config="${production_template}"
          release_template="${production_template}"
          if [ "${RELEASE_MODE:-}" = 'bootstrap' ]; then
            current_stage=$(jq -er '.managedExecutor.stage' "${production_template}")
            case "${current_stage}" in
              active)
                release_template="${release_dir}/policy-bootstrap-template.json"
                go -C v2 run ./cmd/agentserver-deploy prepare-policy-bootstrap \
                  --config="${production_template}" \
                  --output="${release_template}"
                ;;
              policy-bootstrap)
                ;;
              *)
                echo "bootstrap publication requires active or policy-bootstrap input, got ${current_stage}" >&2
                exit 1
                ;;
            esac
          fi
          go -C v2 run ./cmd/agentserver-deploy lock-release \
            --config="${release_template}" \
            --output="${release_dir}/production.json" \
            --service-image="registry-sg.byted.cs.ac.cn/ghcr/agentserver/v2-service@${SERVICE_DIGEST}" \
            --harness-image="registry-sg.byted.cs.ac.cn/ghcr/agentserver/v2-harness@${HARNESS_DIGEST}" \
            --hydra-image="registry-sg.byted.cs.ac.cn/ghcr/agentserver/hydra@${PUBLISHED_HYDRA_DIGEST}" \
            --managed-sandbox-image="registry-sg.byted.cs.ac.cn/ghcr/agentserver/v2-managed-sandbox@${MANAGED_SANDBOX_DIGEST}" \
            --managed-skill-sha256="${MANAGED_SKILL_SHA256}" \
            --lark-cli-sha256="${LARK_CLI_SHA256}" \
            --lark-skill-sha256="${LARK_SKILL_SHA256}" \
            --bkectl-source-revision="${BKECTL_SOURCE_REVISION}" \
            --bkectl-cli-sha256="$(jq -er '.managedExecutor.bkectl.cliSha256' "${release_template}")" \
            --bkectl-skill-pack-sha256="$(jq -er '.managedExecutor.bkectl.skillPackSha256' "${release_template}")" \
            --bkectl-policy-sha256="$(jq -er '.managedExecutor.bkectl.policySha256' "${release_template}")"
          go -C v2 run ./cmd/agentserver-image verify-managed-release \
            --config="${release_dir}/production.json" \
            --harness-manifest="${RUNNER_TEMP}/agentserver-v2-image-evidence/harness-image-manifest.json" \
            --harness-archive="${RUNNER_TEMP}/agentserver-v2-image-evidence/harness-image.oci.tar" \
            --manifest="${RUNNER_TEMP}/agentserver-v2-image-evidence/managed-sandbox-image-manifest.json" \
            --archive="${RUNNER_TEMP}/agentserver-v2-image-evidence/managed-sandbox-image.oci.tar" \
            | tee "${release_dir}/managed-release-verification.txt"
          go -C v2 run ./cmd/agentserver-deploy chart \
            --config="${release_dir}/production.json" \
            --output="${chart_dir}"
          helm lint --strict --namespace agentserver "${chart_dir}"
          helm template agentserver-v2 "${chart_dir}" --namespace agentserver >/dev/null
          managed_stage=$(jq -r '.managedExecutor.stage' "${release_dir}/production.json")
          probe_values=(--set taeNetworkProbe.enabled=true)
          while IFS= read -r probe_region; do
            probe_values+=(
              --set-string
              "taeNetworkProbe.policyRevisions.${probe_region}=ci-published-revision-1"
            )
          done < <(jq -r '.sandboxRegions.regions[]?' "${release_dir}/production.json")
          case "${managed_stage}" in
            policy-bootstrap)
              test "${#probe_values[@]}" -gt 2
              helm lint --strict --namespace agentserver \
                "${probe_values[@]}" \
                "${chart_dir}"
              helm template agentserver-v2 "${chart_dir}" --namespace agentserver \
                "${probe_values[@]}" \
                --show-only templates/25-tae-network-probe.yaml >/dev/null
              ;;
            active|disabled)
              if helm template agentserver-v2 "${chart_dir}" --namespace agentserver \
                "${probe_values[@]}" \
                >/dev/null 2>&1; then
                echo "${managed_stage} Chart unexpectedly enabled the TAE network probe" >&2
                exit 1
              fi
              ;;
            *)
              echo "unsupported managed executor stage in locked Chart: ${managed_stage}" >&2
              exit 1
              ;;
          esac
          deployment_sha=$(sed -n 's/^deploymentConfigSHA256: "\([0-9a-f]\{64\}\)"$/\1/p' "${chart_dir}/values.yaml")
          chart_version=$(sed -n 's/^version: \([^[:space:]]*\)$/\1/p' "${chart_dir}/Chart.yaml")
          test "${#deployment_sha}" = 64
          test "${chart_version}" = "0.1.0-config.d$(printf '%s' "${deployment_sha}" | cut -c1-12)"
          helm package "${chart_dir}" --destination "${release_dir}"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm push "${release_dir}/agentserver-v2-${chart_version}.tgz" oci://ghcr.io/agentserver
          helm show chart "oci://${CHART_REPOSITORY}" --version "${chart_version}" >/dev/null
          printf 'deployment_sha=%s\n' "${deployment_sha}" >>"${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${chart_version}" >>"${GITHUB_OUTPUT}"
          printf 'release_dir=%s\n' "${release_dir}" >>"${GITHUB_OUTPUT}"

      - name: Verify anonymous GHCR pulls
        env:
          SERVICE_DIGEST: ${{ steps.images.outputs.service_digest }}
          HARNESS_DIGEST: ${{ steps.images.outputs.harness_digest }}
          MANAGED_SANDBOX_DIGEST: ${{ steps.images.outputs.managed_sandbox_digest }}
          MANAGED_SANDBOX_TAE_TAG: ${{ steps.images.outputs.managed_sandbox_tae_tag }}
          PUBLISHED_HYDRA_DIGEST: ${{ steps.images.outputs.hydra_digest }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail
          skopeo_retry=(--retry-times 10)
          test "$(skopeo inspect "${skopeo_retry[@]}" --no-creds --format '{{.Os}}/{{.Architecture}}' \
            "docker://${SERVICE_REPOSITORY}@${SERVICE_DIGEST}")" = 'linux/amd64'
          test "$(skopeo inspect "${skopeo_retry[@]}" --no-creds --format '{{.Os}}/{{.Architecture}}' \
            "docker://${HARNESS_REPOSITORY}@${HARNESS_DIGEST}")" = 'linux/amd64'
          test "$(skopeo inspect "${skopeo_retry[@]}" --no-creds --format '{{.Os}}/{{.Architecture}}' \
            "docker://${MANAGED_SANDBOX_REPOSITORY}@${MANAGED_SANDBOX_DIGEST}")" = 'linux/amd64'
          test "$(skopeo inspect "${skopeo_retry[@]}" --no-creds --format '{{.Digest}}' \
            "docker://${MANAGED_SANDBOX_REPOSITORY}:${MANAGED_SANDBOX_TAE_TAG}")" = "${MANAGED_SANDBOX_DIGEST}"
          test "$(skopeo inspect "${skopeo_retry[@]}" --no-creds --format '{{.Digest}}' \
            "docker://registry-sg.byted.cs.ac.cn/ghcr/agentserver/v2-managed-sandbox:${MANAGED_SANDBOX_TAE_TAG}")" = "${MANAGED_SANDBOX_DIGEST}"
          test "$(skopeo inspect "${skopeo_retry[@]}" --no-creds --format '{{.Os}}/{{.Architecture}}' \
            "docker://${HYDRA_REPOSITORY}@${PUBLISHED_HYDRA_DIGEST}")" = 'linux/amd64'
          anonymous_helm_config="${RUNNER_TEMP}/anonymous-helm-registry.json"
          printf '%s\n' '{"auths":{}}' >"${anonymous_helm_config}"
          HELM_REGISTRY_CONFIG="${anonymous_helm_config}" \
            helm show chart "oci://${CHART_REPOSITORY}" --version "${CHART_VERSION}" >/dev/null

      - name: Record published artifact contract
        env:
          SERVICE_DIGEST: ${{ steps.images.outputs.service_digest }}
          HARNESS_DIGEST: ${{ steps.images.outputs.harness_digest }}
          MANAGED_SANDBOX_DIGEST: ${{ steps.images.outputs.managed_sandbox_digest }}
          MANAGED_SANDBOX_TAE_TAG: ${{ steps.images.outputs.managed_sandbox_tae_tag }}
          PUBLISHED_HYDRA_DIGEST: ${{ steps.images.outputs.hydra_digest }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          DEPLOYMENT_SHA: ${{ steps.chart.outputs.deployment_sha }}
        run: |
          set -euo pipefail
          {
            printf '## AgentServer v2 production artifacts\n\n'
            printf -- '- Platform: `linux/amd64`\n'
            printf -- '- Service: `%s@%s`\n' "${SERVICE_REPOSITORY}" "${SERVICE_DIGEST}"
            printf -- '- Harness: `%s@%s`\n' "${HARNESS_REPOSITORY}" "${HARNESS_DIGEST}"
            printf -- '- Managed sandbox: `%s@%s`\n' "${MANAGED_SANDBOX_REPOSITORY}" "${MANAGED_SANDBOX_DIGEST}"
            printf -- '- Managed runtime tag (GHCR): `%s:%s`\n' \
              "${MANAGED_SANDBOX_REPOSITORY}" "${MANAGED_SANDBOX_TAE_TAG}"
            printf -- '- Lark CLI SHA-256: `%s`\n' "${LARK_CLI_SHA256}"
            printf -- '- Lark Skill SHA-256: `%s`\n' "${LARK_SKILL_SHA256}"
            printf -- '- Hydra: `%s@%s`\n' "${HYDRA_REPOSITORY}" "${PUBLISHED_HYDRA_DIGEST}"
            printf -- '- Chart: `oci://%s:%s`\n' "${CHART_REPOSITORY}" "${CHART_VERSION}"
            printf -- '- Deployment config SHA-256: `%s`\n' "${DEPLOYMENT_SHA}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: agentserver-v2-production-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/agentserver-v2-image-evidence/*-image-manifest.json
            ${{ steps.chart.outputs.release_dir }}/production.json
            ${{ steps.chart.outputs.release_dir }}/managed-release-verification.txt
            ${{ steps.chart.outputs.release_dir }}/agentserver-v2-*.tgz

  publish-service-only:
    needs: frontend
    if: ${{ !inputs.active_chart_only && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[full release]')) || inputs.release_mode == 'service_only') }}
    runs-on: k8s-sg
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dsh-frontend
          path: v2/dsh-web/dist

      - uses: actions/setup-go@v6
        with:
          go-version-file: v2/go.mod
          cache: false

      - name: Configure code.byted.org read access
        env:
          CODE_BYTED_USERNAME: ${{ secrets.CODE_BYTED_USERNAME }}
          CODE_BYTED_TOKEN: ${{ secrets.CODE_BYTED_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CODE_BYTED_USERNAME}" && test -n "${CODE_BYTED_TOKEN}"
          credential_file="${RUNNER_TEMP}/code-byted.credentials"
          umask 077
          git config --global credential.helper "store --file=${credential_file}"
          printf 'protocol=https\nhost=code.byted.org\nusername=%s\npassword=%s\n\n' \
            "${CODE_BYTED_USERNAME}" "${CODE_BYTED_TOKEN}" | git credential approve
          printf '%s\n' \
            'GIT_TERMINAL_PROMPT=0' \
            'GOPRIVATE=code.byted.org' \
            'GONOSUMDB=code.byted.org' >>"${GITHUB_ENV}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Build and publish only the service image
        id: service
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/agentserver-v2-service-evidence"
          ./v2/deploy/production/build-service-image.sh \
            --platform=linux-amd64 \
            --service-image="${SERVICE_REPOSITORY}:sha-${GITHUB_SHA}" \
            --cache=none \
            --output-dir="${evidence}"
          service_digest=$(tr -d '\n' <"${evidence}/service-image-digest.txt")
          test "${#service_digest}" = 71
          printf 'service_digest=%s\n' "${service_digest}" >>"${GITHUB_OUTPUT}"

      - name: Generate image-locked chart with reused runtime artifacts
        id: chart
        env:
          SERVICE_DIGEST: ${{ steps.service.outputs.service_digest }}
          SG_PRODUCTION_CONFIG_B64: ${{ secrets.V2_SG_PRODUCTION_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${SG_PRODUCTION_CONFIG_B64:-}"
          release_dir="${RUNNER_TEMP}/agentserver-v2-service-release"
          chart_dir="${release_dir}/agentserver-v2"
          install -d -m 0700 "${release_dir}"
          umask 077
          release_config="${release_dir}/sg-production.json"
          printf '%s' "${SG_PRODUCTION_CONFIG_B64}" | base64 --decode >"${release_config}"
          chmod 0600 "${release_config}"
          managed_stage=$(jq -er '.managedExecutor.stage' "${release_config}")
          go -C v2 build -o "${release_dir}/agentserver-deploy" ./cmd/agentserver-deploy
          case "${managed_stage}" in
            active)
              "${release_dir}/agentserver-deploy" lock-developer-service \
                --config="${release_config}" \
                --output="${release_dir}/production.json" \
                --service-image="registry-sg.byted.cs.ac.cn/ghcr/agentserver/v2-service@${SERVICE_DIGEST}"
              ;;
            policy-bootstrap)
              harness_image=$(jq -er '.images.harness' "${release_config}")
              hydra_image=$(jq -er '.images.hydra' "${release_config}")
              managed_sandbox_image=$(jq -er '.images.managedSandbox' "${release_config}")
              managed_skill_sha=$(jq -er '.managedExecutor.baseInstructionsSha256' "${release_config}")
              lark_cli_sha=$(jq -er '.managedExecutor.lark.cliSha256' "${release_config}")
              lark_skill_sha=$(jq -er '.managedExecutor.lark.skillSha256' "${release_config}")
              bkectl_source_revision=$(jq -er '.managedExecutor.bkectl.sourceRevision' "${release_config}")
              bkectl_cli_sha=$(jq -er '.managedExecutor.bkectl.cliSha256' "${release_config}")
              bkectl_skill_pack_sha=$(jq -er '.managedExecutor.bkectl.skillPackSha256' "${release_config}")
              bkectl_policy_sha=$(jq -er '.managedExecutor.bkectl.policySha256' "${release_config}")
              "${release_dir}/agentserver-deploy" lock-release \
                --config="${release_config}" \
                --output="${release_dir}/production.json" \
                --service-image="registry-sg.byted.cs.ac.cn/ghcr/agentserver/v2-service@${SERVICE_DIGEST}" \
                --harness-image="${harness_image}" \
                --hydra-image="${hydra_image}" \
                --managed-sandbox-image="${managed_sandbox_image}" \
                --managed-skill-sha256="${managed_skill_sha}" \
                --lark-cli-sha256="${lark_cli_sha}" \
                --lark-skill-sha256="${lark_skill_sha}" \
                --bkectl-source-revision="${bkectl_source_revision}" \
                --bkectl-cli-sha256="${bkectl_cli_sha}" \
                --bkectl-skill-pack-sha256="${bkectl_skill_pack_sha}" \
                --bkectl-policy-sha256="${bkectl_policy_sha}"
              ;;
            *)
              echo "unsupported managed executor stage for service-only publication: ${managed_stage}" >&2
              exit 1
              ;;
          esac
          # Prove that the fast path changed only images.service. The selected
          # harness, managed sandbox, Hydra, and the current fail-closed or
          # evidence-bound TAE authority remain unchanged.
          jq --sort-keys 'del(.images.service)' "${release_config}" >"${release_dir}/before.json"
          jq --sort-keys 'del(.images.service)' "${release_dir}/production.json" >"${release_dir}/after.json"
          cmp "${release_dir}/before.json" "${release_dir}/after.json"
          "${release_dir}/agentserver-deploy" chart \
            --config="${release_dir}/production.json" \
            --output="${chart_dir}"
          helm lint --strict --namespace agentserver "${chart_dir}"
          deployment_sha=$(sed -n 's/^deploymentConfigSHA256: "\([0-9a-f]\{64\}\)"$/\1/p' "${chart_dir}/values.yaml")
          chart_version=$(sed -n 's/^version: \([^[:space:]]*\)$/\1/p' "${chart_dir}/Chart.yaml")
          test "${#deployment_sha}" = 64
          test "${chart_version}" = "0.1.0-config.d$(printf '%s' "${deployment_sha}" | cut -c1-12)"
          helm package "${chart_dir}" --destination "${release_dir}"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm push "${release_dir}/agentserver-v2-${chart_version}.tgz" oci://ghcr.io/agentserver
          printf 'deployment_sha=%s\n' "${deployment_sha}" >>"${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${chart_version}" >>"${GITHUB_OUTPUT}"
          printf 'managed_stage=%s\n' "${managed_stage}" >>"${GITHUB_OUTPUT}"
          printf 'release_dir=%s\n' "${release_dir}" >>"${GITHUB_OUTPUT}"

      - name: Record service-only development release
        env:
          SERVICE_DIGEST: ${{ steps.service.outputs.service_digest }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          DEPLOYMENT_SHA: ${{ steps.chart.outputs.deployment_sha }}
          MANAGED_STAGE: ${{ steps.chart.outputs.managed_stage }}
        run: |
          {
            printf '## AgentServer v2 service-only development release\n\n'
            printf -- '- Service: `%s@%s`\n' "${SERVICE_REPOSITORY}" "${SERVICE_DIGEST}"
            printf -- '- Chart: `oci://%s:%s`\n' "${CHART_REPOSITORY}" "${CHART_VERSION}"
            printf -- '- Deployment config SHA-256: `%s`\n' "${DEPLOYMENT_SHA}"
            printf -- '- Managed executor stage: `%s`\n' "${MANAGED_STAGE}"
            printf -- '- Reused: harness, managed sandbox, Hydra, runtime/pack locks, and the current TAE gate state\n'
            printf -- '- Skipped: web dependency install, full repository check, Codex/bwrap/Lark downloads, and unchanged image builds\n'
          } >>"${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: agentserver-v2-service-only-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/agentserver-v2-service-evidence/service-image-manifest.json
            ${{ steps.chart.outputs.release_dir }}/production.json
            ${{ steps.chart.outputs.release_dir }}/agentserver-v2-*.tgz

  promote-locked-chart:
    if: ${{ inputs.active_chart_only }}
    runs-on: k8s-sg
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: v2/go.mod
          cache: false

      - name: Configure code.byted.org read access
        env:
          CODE_BYTED_USERNAME: ${{ secrets.CODE_BYTED_USERNAME }}
          CODE_BYTED_TOKEN: ${{ secrets.CODE_BYTED_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CODE_BYTED_USERNAME}" && test -n "${CODE_BYTED_TOKEN}"
          credential_file="${RUNNER_TEMP}/code-byted.credentials"
          umask 077
          git config --global credential.helper "store --file=${credential_file}"
          printf 'protocol=https\nhost=code.byted.org\nusername=%s\npassword=%s\n\n' \
            "${CODE_BYTED_USERNAME}" "${CODE_BYTED_TOKEN}" | git credential approve
          printf '%s\n' \
            'GIT_TERMINAL_PROMPT=0' \
            'GOPRIVATE=code.byted.org' \
            'GONOSUMDB=code.byted.org' >>"${GITHUB_ENV}"

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Validate and publish the image-locked chart
        id: active_chart
        env:
          SG_PRODUCTION_CONFIG_B64: ${{ secrets.V2_SG_PRODUCTION_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${SG_PRODUCTION_CONFIG_B64:-}"
          release_dir="${RUNNER_TEMP}/agentserver-v2-active-release"
          chart_dir="${release_dir}/agentserver-v2"
          install -d -m 0700 "${release_dir}"
          umask 077
          production_template="${release_dir}/sg-production-template.json"
          printf '%s' "${SG_PRODUCTION_CONFIG_B64}" | base64 --decode >"${production_template}"
          chmod 0600 "${production_template}"
          managed_stage=$(jq -er '.managedExecutor.stage' "${production_template}")
          go -C v2 run ./cmd/agentserver-deploy validate --config="${production_template}"

          service_image=$(jq -er '.images.service' "${production_template}")
          harness_image=$(jq -er '.images.harness' "${production_template}")
          hydra_image=$(jq -er '.images.hydra' "${production_template}")
          managed_sandbox_image=$(jq -er '.images.managedSandbox' "${production_template}")
          managed_skill_sha=$(jq -er '.managedExecutor.baseInstructionsSha256' "${production_template}")
          lark_cli_sha=$(jq -er '.managedExecutor.lark.cliSha256' "${production_template}")
          lark_skill_sha=$(jq -er '.managedExecutor.lark.skillSha256' "${production_template}")
          bkectl_source_revision=$(jq -er '.managedExecutor.bkectl.sourceRevision' "${production_template}")
          bkectl_cli_sha=$(jq -er '.managedExecutor.bkectl.cliSha256' "${production_template}")
          bkectl_skill_pack_sha=$(jq -er '.managedExecutor.bkectl.skillPackSha256' "${production_template}")
          bkectl_policy_sha=$(jq -er '.managedExecutor.bkectl.policySha256' "${production_template}")
          go -C v2 run ./cmd/agentserver-deploy lock-release \
            --config="${production_template}" \
            --output="${release_dir}/production.json" \
            --service-image="${service_image}" \
            --harness-image="${harness_image}" \
            --hydra-image="${hydra_image}" \
            --managed-sandbox-image="${managed_sandbox_image}" \
            --managed-skill-sha256="${managed_skill_sha}" \
            --lark-cli-sha256="${lark_cli_sha}" \
            --lark-skill-sha256="${lark_skill_sha}" \
            --bkectl-source-revision="${bkectl_source_revision}" \
            --bkectl-cli-sha256="${bkectl_cli_sha}" \
            --bkectl-skill-pack-sha256="${bkectl_skill_pack_sha}" \
            --bkectl-policy-sha256="${bkectl_policy_sha}"
          go -C v2 run ./cmd/agentserver-deploy chart \
            --config="${release_dir}/production.json" \
            --output="${chart_dir}"
          helm lint --strict --namespace agentserver "${chart_dir}"
          helm template agentserver-v2 "${chart_dir}" --namespace agentserver >/dev/null
          probe_values=(--set taeNetworkProbe.enabled=true)
          while IFS= read -r probe_region; do
            probe_values+=(
              --set-string
              "taeNetworkProbe.policyRevisions.${probe_region}=ci-published-revision-1"
            )
          done < <(jq -r '.sandboxRegions.regions[]?' "${release_dir}/production.json")
          case "${managed_stage}" in
            policy-bootstrap)
              test "${#probe_values[@]}" -gt 2
              helm lint --strict --namespace agentserver \
                "${probe_values[@]}" \
                "${chart_dir}"
              helm template agentserver-v2 "${chart_dir}" --namespace agentserver \
                "${probe_values[@]}" \
                --show-only templates/25-tae-network-probe.yaml >/dev/null
              ;;
            active)
              if helm template agentserver-v2 "${chart_dir}" --namespace agentserver \
                  "${probe_values[@]}" \
                  >/dev/null 2>&1; then
                echo 'active Chart unexpectedly enabled the TAE network probe' >&2
                exit 1
              fi
              ;;
            *)
              echo "unsupported managed executor stage for locked Chart publication: ${managed_stage}" >&2
              exit 1
              ;;
          esac

          deployment_sha=$(sed -n 's/^deploymentConfigSHA256: "\([0-9a-f]\{64\}\)"$/\1/p' "${chart_dir}/values.yaml")
          chart_version=$(sed -n 's/^version: \([^[:space:]]*\)$/\1/p' "${chart_dir}/Chart.yaml")
          test "${#deployment_sha}" = 64
          test "${chart_version}" = "0.1.0-config.d$(printf '%s' "${deployment_sha}" | cut -c1-12)"
          helm package "${chart_dir}" --destination "${release_dir}"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm push "${release_dir}/agentserver-v2-${chart_version}.tgz" oci://ghcr.io/agentserver
          helm show chart "oci://${CHART_REPOSITORY}" --version "${chart_version}" >/dev/null
          printf 'deployment_sha=%s\n' "${deployment_sha}" >>"${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${chart_version}" >>"${GITHUB_OUTPUT}"
          printf 'managed_stage=%s\n' "${managed_stage}" >>"${GITHUB_OUTPUT}"
          printf 'release_dir=%s\n' "${release_dir}" >>"${GITHUB_OUTPUT}"

      - name: Record promoted contract
        env:
          CHART_VERSION: ${{ steps.active_chart.outputs.version }}
          DEPLOYMENT_SHA: ${{ steps.active_chart.outputs.deployment_sha }}
          MANAGED_STAGE: ${{ steps.active_chart.outputs.managed_stage }}
        run: |
          {
            printf '## Image-locked AgentServer v2 Chart\n\n'
            printf -- '- Managed executor stage: `%s`\n' "${MANAGED_STAGE}"
            printf -- '- Chart: `oci://%s:%s`\n' "${CHART_REPOSITORY}" "${CHART_VERSION}"
            printf -- '- Deployment config SHA-256: `%s`\n' "${DEPLOYMENT_SHA}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: agentserver-v2-locked-chart-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.active_chart.outputs.release_dir }}/production.json
            ${{ steps.active_chart.outputs.release_dir }}/agentserver-v2-*.tgz
