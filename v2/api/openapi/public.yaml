{
  "openapi": "3.1.0",
  "info": {
    "title": "agentserver v2 user resource API",
    "version": "0.1.0",
    "description": "Platform and Browser user resources, including Core-owned workspace credential bindings. Core requires the matching gateway workload identity and validates every original opaque user bearer through Hydra introspection, including its exact client, audience, action scopes, and workspace resource grant."
  },
  "servers": [{"url": "https://agentserver-core"}],
  "security": [{"browserGatewayMTLS": [], "browserOAuth": ["runs:read"]}],
  "paths": {
    "/v2/credential-providers": {
      "get": {
        "operationId": "listCredentialProviderSchemas",
        "description": "Lists the provider schemas supported by the configured v2 Core. Schemas describe accepted secret envelopes; no credential instance or secret is returned.",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["credentials:read"]}],
        "responses": {
          "200": {"description": "Provider schemas", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ListWorkspaceCredentialProviderSchemasResponse"}}}},
          "401": {"$ref": "#/components/responses/PublicError"},
          "503": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/credentials/{kind}": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}, {"$ref": "#/components/parameters/CredentialKind"}],
      "get": {
        "operationId": "listWorkspaceCredentials",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["credentials:read"]}],
        "responses": {
          "200": {"description": "Credential metadata", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ListWorkspaceCredentialsResponse"}}}},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"}
        }
      },
      "post": {
        "operationId": "createWorkspaceCredential",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["credentials:manage"]}],
        "requestBody": {"required": true, "x-agentserver-maxBytes": 524288, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateWorkspaceCredentialRequest"}}}},
        "responses": {
          "201": {"description": "Credential binding created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateWorkspaceCredentialResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/credentials/{kind}/{bindingId}": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}, {"$ref": "#/components/parameters/CredentialKind"}, {"$ref": "#/components/parameters/CredentialBindingId"}],
      "patch": {
        "operationId": "renameWorkspaceCredential",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["credentials:manage"]}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RenameWorkspaceCredentialRequest"}}}},
        "responses": {
          "200": {"description": "Credential metadata updated", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RenameWorkspaceCredentialResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/credentials/{kind}/{bindingId}:rotate": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}, {"$ref": "#/components/parameters/CredentialKind"}, {"$ref": "#/components/parameters/CredentialBindingId"}],
      "post": {
        "operationId": "rotateWorkspaceCredential",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["credentials:manage"]}],
        "requestBody": {"required": true, "x-agentserver-maxBytes": 524288, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RotateWorkspaceCredentialRequest"}}}},
        "responses": {
          "200": {"description": "Credential binding rotated", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RotateWorkspaceCredentialResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/credentials/{kind}/{bindingId}:revoke": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}, {"$ref": "#/components/parameters/CredentialKind"}, {"$ref": "#/components/parameters/CredentialBindingId"}],
      "post": {
        "operationId": "revokeWorkspaceCredential",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["credentials:manage"]}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RevokeWorkspaceCredentialRequest"}}}},
        "responses": {
          "200": {"description": "Credential binding revoked", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RevokeWorkspaceCredentialResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/credentials/{kind}/{bindingId}:delete": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}, {"$ref": "#/components/parameters/CredentialKind"}, {"$ref": "#/components/parameters/CredentialBindingId"}],
      "post": {
        "operationId": "deleteWorkspaceCredential",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["credentials:manage"]}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DeleteWorkspaceCredentialRequest"}}}},
        "responses": {
          "200": {"description": "Credential binding deleted", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DeleteWorkspaceCredentialResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/credentials/{kind}/{bindingId}:setDefault": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}, {"$ref": "#/components/parameters/CredentialKind"}, {"$ref": "#/components/parameters/CredentialBindingId"}],
      "post": {
        "operationId": "setDefaultWorkspaceCredential",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["credentials:manage"]}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SetDefaultWorkspaceCredentialRequest"}}}},
        "responses": {
          "200": {"description": "Credential default changed", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SetDefaultWorkspaceCredentialResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/credential-authorizations/{kind}": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}, {"$ref": "#/components/parameters/CredentialKind"}],
      "post": {
        "operationId": "beginWorkspaceCredentialAuthorization",
        "description": "Begins one provider device-flow transaction. Core seals and persists the provider ticket; Platform receives only the user-facing verification link and code.",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["credentials:manage"]}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BeginWorkspaceCredentialAuthorizationRequest"}}}},
        "responses": {
          "201": {"description": "Device authorization started", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BeginWorkspaceCredentialAuthorizationResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"},
          "503": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/credential-authorizations/{kind}/{authorizationId}": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}, {"$ref": "#/components/parameters/CredentialKind"}, {"$ref": "#/components/parameters/CredentialAuthorizationId"}],
      "get": {
        "operationId": "getWorkspaceCredentialAuthorization",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["credentials:read"]}],
        "responses": {
          "200": {"description": "Current device authorization state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GetWorkspaceCredentialAuthorizationResponse"}}}},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/credential-authorizations/{kind}/{authorizationId}:poll": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}, {"$ref": "#/components/parameters/CredentialKind"}, {"$ref": "#/components/parameters/CredentialAuthorizationId"}],
      "post": {
        "operationId": "pollWorkspaceCredentialAuthorization",
        "description": "Performs at most one upstream provider poll. Core enforces the provider interval and a cross-replica poll lease.",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["credentials:manage"]}],
        "responses": {
          "200": {"description": "Updated device authorization state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PollWorkspaceCredentialAuthorizationResponse"}}}},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/credential-authorizations/{kind}/{authorizationId}:cancel": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}, {"$ref": "#/components/parameters/CredentialKind"}, {"$ref": "#/components/parameters/CredentialAuthorizationId"}],
      "post": {
        "operationId": "cancelWorkspaceCredentialAuthorization",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["credentials:manage"]}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CancelWorkspaceCredentialAuthorizationRequest"}}}},
        "responses": {
          "200": {"description": "Device authorization cancelled or already terminal", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CancelWorkspaceCredentialAuthorizationResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces": {
      "get": {
        "operationId": "listWorkspaces",
        "description": "Lists the active user's persisted workspace memberships using global Platform read authority.",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["workspaces:read"]}],
        "responses": {
          "200": {"description": "Granted workspaces", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ListWorkspacesResponse"}}}},
          "401": {"$ref": "#/components/responses/PublicError"},
          "503": {"$ref": "#/components/responses/PublicError"}
        }
      },
      "post": {
        "operationId": "createWorkspace",
        "description": "Creates an active workspace and its first owner membership in one transaction.",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["workspaces:create"]}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateWorkspaceRequest"}}}},
        "responses": {
          "200": {"description": "Exact workspace already exists", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateWorkspaceResponse"}}}},
          "201": {"description": "Workspace created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateWorkspaceResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}],
      "get": {
        "operationId": "getWorkspace",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["workspaces:read"]}],
        "responses": {
          "200": {"description": "Workspace state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/WorkspaceState"}}}},
          "401": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"}
        }
      },
      "patch": {
        "operationId": "updateWorkspace",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["workspaces:update"]}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UpdateWorkspaceRequest"}}}},
        "responses": {
          "200": {"description": "Updated workspace", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UpdateWorkspaceResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/actions/archive": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}],
      "post": {
        "operationId": "archiveWorkspace",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["workspaces:archive"]}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ArchiveWorkspaceRequest"}}}},
        "responses": {
          "200": {"description": "Archived workspace", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ArchiveWorkspaceResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/managed-sandbox-settings": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}],
      "get": {
        "operationId": "getWorkspaceManagedSandboxSetting",
        "description": "Returns the workspace-managed TAE sandbox region and the deployment-installed region choices. The setting is snapshotted when a new Run is created.",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["workspaces:read"]}],
        "responses": {
          "200": {"description": "Managed sandbox setting", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GetWorkspaceManagedSandboxSettingResponse"}}}},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"}
        }
      },
      "patch": {
        "operationId": "updateWorkspaceManagedSandboxSetting",
        "description": "Owner-only optimistic update of the workspace-managed TAE sandbox region. Existing Runs retain their frozen region and profile binding.",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["workspaces:update"]}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UpdateWorkspaceManagedSandboxSettingRequest"}}}},
        "responses": {
          "200": {"description": "Updated managed sandbox setting", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UpdateWorkspaceManagedSandboxSettingResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/members": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}],
      "get": {
        "operationId": "listWorkspaceMembers",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["members:read"]}],
        "responses": {
          "200": {"description": "Active workspace members", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ListWorkspaceMembersResponse"}}}},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"}
        }
      },
      "post": {
        "operationId": "addWorkspaceMember",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["members:add"]}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AddWorkspaceMemberRequest"}}}},
        "responses": {
          "200": {"description": "Exact member already exists", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AddWorkspaceMemberResponse"}}}},
          "201": {"description": "Member added", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AddWorkspaceMemberResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/members/{memberId}": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}, {"$ref": "#/components/parameters/MemberId"}],
      "patch": {
        "operationId": "updateWorkspaceMember",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["members:update"]}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UpdateWorkspaceMemberRequest"}}}},
        "responses": {
          "200": {"description": "Updated member", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UpdateWorkspaceMemberResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      },
      "delete": {
        "operationId": "removeWorkspaceMember",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["members:remove"]}],
        "responses": {
          "200": {"description": "Member removal result", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RemoveWorkspaceMemberResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/executors": {
      "parameters": [
        {"$ref": "#/components/parameters/WorkspaceId"}
      ],
      "get": {
        "operationId": "listExecutorResources",
        "description": "Lists bounded executor state for one active workspace.",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["executors:read"]}],
        "responses": {
          "200": {"description": "Workspace executors", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ListExecutorResourcesResponse"}}}},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"}
        }
      },
      "post": {
        "operationId": "createExecutorResource",
        "description": "Creates one enrolling executor identity. Core rechecks that the current user is an owner of the active workspace.",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["executors:create"]}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateExecutorResourceRequest"}}}},
        "responses": {
          "200": {"description": "Exact executor identity already exists", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateExecutorResourceResponse"}}}},
          "201": {"description": "Executor identity created in enrolling state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateExecutorResourceResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/executors/{executorId}": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}, {"$ref": "#/components/parameters/ExecutorId"}],
      "delete": {
        "operationId": "archiveExecutorResource",
        "description": "Owner-only executor revocation that fences connections, disables environments, and revokes pending enrollment tokens atomically.",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["executors:archive"]}],
        "responses": {
          "200": {"description": "Revoked executor", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ArchiveExecutorResourceResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/executors/{executorId}:enrollmentToken": {
      "parameters": [
        {"$ref": "#/components/parameters/WorkspaceId"},
        {"$ref": "#/components/parameters/ExecutorId"}
      ],
      "post": {
        "operationId": "issueExecutorEnrollmentToken",
        "description": "Issues or exactly recovers one short-lived, single-executor enrollment bearer. A new idempotency key revokes the prior unconsumed bearer authority.",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["executors:enroll"]}],
        "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}],
        "responses": {
          "200": {"description": "Exact idempotent token request recovered", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IssueExecutorEnrollmentTokenResponse"}}}},
          "201": {"description": "Enrollment token issued", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IssueExecutorEnrollmentTokenResponse"}}}},
          "400": {"$ref": "#/components/responses/PublicError"},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"},
          "409": {"$ref": "#/components/responses/PublicError"}
        }
      }
    },
    "/v2/workspaces/{workspaceId}/llm-gateways": {
      "parameters": [{"$ref": "#/components/parameters/WorkspaceId"}],
      "get": {
        "operationId": "listWorkspaceLLMGateways",
        "description": "Lists workspace Gateway configuration and only the current user's grant status; sealed token material is never projected.",
        "security": [{"platformGatewayMTLS": [], "platformOAuth": ["llm-gateways:read"]}],
        "responses": {
          "200": {"description": "Workspace Gateways and current-user grant projections", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ListWorkspaceLLMGatewaysResponse"}}}},
          "401": {"$ref": "#/components/responses/PublicError"},
          "403": {"$ref": "#/components/responses/PublicError"},
          "404": {"$ref": "#/components/responses/PublicError"}
        }
      },
      "post": {
        "operationId": "createWorkspaceLLMGateway",
