{
  "asyncapi": "3.0.0",
  "id": "urn:agentserver:v2:canonical-run-events",
  "info": {
    "title": "agentserver v2 canonical run event cursor and browser projection",
    "version": "1.1.0",
    "description": "Core owns the append-only canonical ledger and run sequence. Each committed event has a scope-bound opaque cursor. browser-gateway long-polls committed facts and projects them to AG-UI SSE with display-only A2UI v0.9 operations and lifecycle-safe reconnect cursors."
  },
  "defaultContentType": "application/json",
  "servers": {
    "coreCursor": {
      "host": "agentserver-core",
      "pathname": "/v2/workspaces/{workspaceId}/runs/{runId}/events",
      "protocol": "https",
      "description": "Authorized, cursor-based read of already committed canonical events. browser-gateway uses workload identity plus the user actor context; it never reads PostgreSQL directly."
    },
    "browserGateway": {
      "host": "browser-gateway",
      "pathname": "/v2/workspaces/{workspaceId}/sessions/{sessionId}/agui",
      "protocol": "https",
      "description": "User-facing AG-UI POST returning text/event-stream. Authorization bearer and Idempotency-Key are mandatory."
    }
  },
  "channels": {
    "canonicalRunCursor": {
      "address": "/v2/workspaces/{workspaceId}/runs/{runId}/events",
      "messages": {
        "canonicalRunEvent": {"$ref": "#/components/messages/CanonicalRunEvent"}
      },
      "bindings": {
        "http": {"method": "GET"}
      }
    },
    "aguiRun": {
      "address": "/v2/workspaces/{workspaceId}/sessions/{sessionId}/agui",
      "messages": {
        "projectedAGUIEvent": {"$ref": "#/components/messages/ProjectedAGUIEvent"}
      },
      "bindings": {
        "http": {"method": "POST"}
      }
    }
  },
  "operations": {
    "readCommittedCanonicalEvents": {
      "action": "receive",
      "channel": {"$ref": "#/channels/canonicalRunCursor"},
      "summary": "Read committed events after an opaque cursor. Each event has a same-index cursor; limit=0 only validates and resolves a reconnect cursor. Cursor expiry returns an authorized snapshot and lifecycle-boundary rebase cursor.",
      "messages": [{"$ref": "#/channels/canonicalRunCursor/messages/canonicalRunEvent"}]
    },
    "streamProjectedAGUIEvents": {
      "action": "send",
      "channel": {"$ref": "#/channels/aguiRun"},
      "summary": "Stream RUN_STARTED followed by committed canonical projections. CUSTOM agentserver.event_cursor is published only at safe lifecycle boundaries and is supplied on reconnect through forwardedProps.agentserver.eventCursor. A browser transport disconnect does not cancel the run.",
      "messages": [{"$ref": "#/channels/aguiRun/messages/projectedAGUIEvent"}]
    }
  },
  "components": {
    "messages": {
      "CanonicalRunEvent": {
        "name": "canonical_run_event",
        "title": "One core-committed canonical run fact",
        "payload": {"$ref": "../schema/canonical-run-event.schema.json"}
      },
      "ProjectedAGUIEvent": {
        "name": "projected_agui_event",
        "title": "AG-UI SDK event serialized in one SSE data frame",
        "payload": {
          "type": "object",
          "description": "Validated against the pinned AG-UI community Go SDK. CUSTOM name agentserver.tool_progress carries progress inside an active tool lifecycle. CUSTOM name agentserver.approval carries canonical approval authority including nonce, context digest, and version. CUSTOM name a2ui.operations carries display-only A2UI v0.9 operations. CUSTOM name agentserver.event_cursor carries a server-issued scope-bound reconnect cursor and its lastEventSequence."
        }
      }
    },
    "securitySchemes": {
      "userOAuth": {
        "type": "oauth2",
        "description": "Hydra agentserver-browser access token with the single aud=agentserver-browser-api audience and exactly one versioned workspace resource grant. Core introspects every request and checks resource ownership invariants.",
        "flows": {
          "authorizationCode": {
            "authorizationUrl": "https://agent.byted.bps.dev/oauth2/auth",
            "tokenUrl": "https://agent.byted.bps.dev/oauth2/token",
            "availableScopes": {
              "runs:create": "Create a run in a session owned by the token subject",
              "runs:read": "Read an authorized run event projection"
            }
          }
        }
      }
    }
  },
  "x-agentserver-projection": {
    "canonicalAuthority": "agentserver-core",
    "gatewayOwnsRunState": false,
    "gatewayReadsPostgreSQL": false,
    "browserDisconnectCancelsRun": false,
    "runStartedSource": "CreateRun response",
    "onlyRunCompletedMapsToRunFinished": true,
    "unknownFutureKinds": "skip after envelope and sequence validation",
    "knownKindUnknownVersion": "fail closed",
    "cursorExpired": "STATE_SNAPSHOT then lifecycle-boundary rebase",
    "cursorIsAuthorization": false,
    "membershipRecheckedPerPoll": true,
    "perEventCursors": true,
    "cursorResolution": "GET event cursor with limit=0 and waitMs=0",
    "cursorPublication": "initial run.queued, authorized snapshot rebase, and committed lifecycle-safe boundaries only",
    "cursorCarrier": "CUSTOM{name:agentserver.event_cursor,value:{version,runId,cursor,lastEventSequence}}",
    "reconnectInput": "forwardedProps.agentserver.eventCursor",
    "toolProgressCarrier": "CUSTOM{name:agentserver.tool_progress,value:{toolCallId,progress,total,message}}",
    "approvalCarrier": "CUSTOM{name:agentserver.approval,value:{approvalId,executionId,runId,runAttemptId,runAttemptGeneration,toolName,status,decision,nonce,contextDigest,expiresAt,approverId,version}}",
    "approvalDecisionCommand": "POST /v2/workspaces/{workspaceId}/approvals/{approvalId}:decide",
    "a2uiCarriesApprovalAuthority": false,
    "a2uiVersion": "v0.9",
    "a2uiCarrier": "CUSTOM{name:a2ui.operations,value:[operations]}"
  }
}
