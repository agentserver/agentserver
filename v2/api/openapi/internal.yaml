  "components": {
    "securitySchemes": {
      "workloadMTLS": {"type": "mutualTLS", "description": "Verified component-specific workload SPIFFE identity; handlers authorize each action separately"},
      "runCapabilityBearer": {"type": "http", "scheme": "bearer", "bearerFormat": "asv2cap1 Ed25519", "description": "Audience-specific short-lived production run capability; every use is also live-authorized by Core"},
