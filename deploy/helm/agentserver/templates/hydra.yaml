{{- if .Values.hydra.enabled }}
# --- Hydra Secret (DSN + system secret) ---
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-hydra-secret" .Release.Name)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-hydra-secret
  labels:
    app.kubernetes.io/component: hydra
type: Opaque
stringData:
  dsn: {{ include "agentserver.hydraDsn" . | quote }}
  pg-password: {{ .Values.postgresql.auth.password | quote }}
  {{- if .Values.hydra.secretsSystem }}
  secrets-system: {{ .Values.hydra.secretsSystem | quote }}
  {{- else if and $existingSecret (index $existingSecret "data") (index $existingSecret.data "secrets-system") }}
  secrets-system: {{ index $existingSecret.data "secrets-system" | b64dec | quote }}
  {{- else }}
  secrets-system: {{ randAlphaNum 32 | quote }}
  {{- end }}
---
# --- Hydra Deployment ---
# initContainers handle DB creation and schema migration before Hydra starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hydra
  labels:
    app.kubernetes.io/component: hydra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: hydra
  template:
    metadata:
      annotations:
        agentserver.x-k8s.io/chart-version: {{ .Chart.AppVersion | quote }}
      labels:
        app.kubernetes.io/component: hydra
    spec:
      initContainers:
        # 1. Create the "hydra" database in shared PostgreSQL
        - name: create-db
          image: {{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h {{ .Release.Name }}-postgresql -U {{ .Values.postgresql.auth.username }}; do sleep 2; done
              PGPASSWORD="$PG_PASSWORD" psql -h {{ .Release.Name }}-postgresql -U {{ .Values.postgresql.auth.username }} -d {{ .Values.postgresql.auth.database }} -tc "SELECT 1 FROM pg_database WHERE datname='{{ .Values.hydra.database.name }}'" | grep -q 1 || \
              PGPASSWORD="$PG_PASSWORD" createdb -h {{ .Release.Name }}-postgresql -U {{ .Values.postgresql.auth.username }} {{ .Values.hydra.database.name }}
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-hydra-secret
                  key: pg-password
        # 2. Run Hydra SQL migrations
        - name: migrate
          image: {{ .Values.hydra.image.repository }}:{{ .Values.hydra.image.tag }}
          imagePullPolicy: {{ .Values.hydra.image.pullPolicy }}
          command: ["hydra", "migrate", "sql", "-e", "--yes"]
          env:
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-hydra-secret
                  key: dsn
      containers:
        - name: hydra
          image: {{ .Values.hydra.image.repository }}:{{ .Values.hydra.image.tag }}
          imagePullPolicy: {{ .Values.hydra.image.pullPolicy }}
          command: ["hydra", "serve", "all"]
          env:
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-hydra-secret
                  key: dsn
            - name: URLS_SELF_ISSUER
              value: {{ printf "https://%s" .Values.platform.domain | quote }}
            - name: URLS_LOGIN
              value: {{ printf "https://%s/api/oauth2/login" .Values.platform.domain | quote }}
            - name: URLS_CONSENT
              value: {{ printf "https://%s/api/oauth2/consent" .Values.platform.domain | quote }}
            - name: SECRETS_SYSTEM
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-hydra-secret
                  key: secrets-system
            - name: SERVE_PUBLIC_PORT
              value: {{ .Values.hydra.publicPort | quote }}
            - name: SERVE_ADMIN_PORT
              value: {{ .Values.hydra.adminPort | quote }}
            - name: URLS_DEVICE_VERIFICATION
              value: {{ printf "https://%s/oauth2/device" .Values.platform.domain | quote }}
            - name: OAUTH2_DEVICE_AUTHORIZATION_TOKEN_POLLING_INTERVAL
              value: {{ .Values.hydra.deviceAuthTokenPollingInterval | quote }}
            # Dynamic Client Registration (RFC 7591) is intentionally
            # OFF. We had it on briefly (#249, #251), but:
            #
            #   - Codex CLI doesn't implement CIMD (the spec-preferred
            #     alternative to DCR) — it only does DCR or
            #     pre-registered client_id.
            #   - Claude Code's DCR works, but every fresh install
            #     creates a new hydra_client row — open registration
            #     means an unauthenticated POST flood can bloat the
            #     table arbitrarily. RFC 7591 §5 calls this out.
            #
            # The replacement path is per-user pre-registered public
            # clients minted via agentserver's /api/me/oauth-clients
            # endpoint (which calls Hydra's admin POST /admin/clients
            # behind the user's auth + ownership table). That gives
            # both clients (Codex, Claude Code) a working OAuth flow
            # without exposing /oauth2/register to the public internet.
            #
            # Leaving the env var pinned to "false" (Hydra's default)
            # is documentation as much as it is config — if anyone
            # flips it back on, they need to also re-add the
            # WEBFINGER_OIDC_DISCOVERY_CLIENT_REGISTRATION_URL env
            # var (otherwise endpoint works but isn't discoverable).
            - name: OIDC_DYNAMIC_CLIENT_REGISTRATION_ENABLED
              value: "false"
            - name: LOG_LEVEL
              value: "info"
          ports:
            - name: public
              containerPort: {{ .Values.hydra.publicPort }}
            - name: admin
              containerPort: {{ .Values.hydra.adminPort }}
          livenessProbe:
            httpGet:
              path: /health/alive
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
# --- Hydra OAuth2 client registration Job ---
# Runs as a regular Job (not a Helm hook) so Pulumi/ArgoCD can manage it.
# Waits for Hydra to be ready, then idempotently registers the CLI client.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-hydra-client-setup-{{ .Chart.Version | replace "." "-" }}
  labels:
    app.kubernetes.io/component: hydra-client-setup
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: hydra-client-setup
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-hydra
          image: {{ .Values.hydra.image.repository }}:{{ .Values.hydra.image.tag }}
          imagePullPolicy: {{ .Values.hydra.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              until wget -qO- http://{{ .Release.Name }}-hydra-admin:{{ .Values.hydra.adminPort }}/health/ready 2>/dev/null | grep -q ok; do
                echo "Waiting for Hydra to be ready..."
                sleep 3
              done
      containers:
        - name: register-client
          image: {{ .Values.hydra.image.repository }}:{{ .Values.hydra.image.tag }}
          imagePullPolicy: {{ .Values.hydra.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              ENDPOINT="http://{{ .Release.Name }}-hydra-admin:{{ .Values.hydra.adminPort }}"

              # 1. agentserver-agent-cli — used by `codex login` device
              # flow against codex-auth.<domain>. Pre-existing client,
              # untouched by the MCP rework.
              CLI_FLAGS="--name Agentserver_Agent_CLI \
                --grant-type urn:ietf:params:oauth:grant-type:device_code \
                --grant-type refresh_token \
                --response-type code \
                --scope openid --scope profile --scope agent:register \
                --token-endpoint-auth-method none \
                --audience https://{{ .Values.platform.domain }}"
              hydra update oauth2-client agentserver-agent-cli --endpoint "$ENDPOINT" $CLI_FLAGS 2>/dev/null || \
              hydra create oauth2-client --endpoint "$ENDPOINT" --id agentserver-agent-cli $CLI_FLAGS

              # MCP OAuth clients — split by surface so each can be
              # audited/revoked independently and the redirect_uris
              # stay minimal-per-surface (Hydra string-matches the full
              # URL including path, so unioning them on one client
              # makes any one client's compromise a wider blast).
              #
              # Common to both:
              #   - PKCE-protected (token_endpoint_auth_method=none).
              #   - Audience pinned to mcp.<domain>/mcp (RFC 8707).
              #   - Pinned port 20202 (ory/hydra#1732: no RFC 8252 §7.3
              #     loopback-any-port support). 20202 dodges common
              #     dev-server ports.
              #   - scope: openid + offline_access (refresh tokens) +
              #     mcp:read + mcp:exec.
              #
              # ── 2a. agentserver-mcp-cli ──────────────────────────────
              # For Claude Code CLI + Codex CLI. They bind callback at
              # /callback (Claude Code's literal --callback-port path,
              # Codex uses the same convention).
              MCP_CLI_FLAGS="--name Agentserver_MCP_CLI \
                --grant-type authorization_code \
                --grant-type refresh_token \
                --response-type code \
                --scope openid --scope offline_access --scope mcp:read --scope mcp:exec \
                --redirect-uri http://localhost:20202/callback \
                --redirect-uri http://127.0.0.1:20202/callback \
                --token-endpoint-auth-method none \
                --audience https://mcp.{{ .Values.platform.domain }}/mcp"
              hydra update oauth2-client agentserver-mcp-cli --endpoint "$ENDPOINT" $MCP_CLI_FLAGS 2>/dev/null || \
              hydra create oauth2-client --endpoint "$ENDPOINT" --id agentserver-mcp-cli $MCP_CLI_FLAGS

              # ── 2b. agentserver-mcp-desktop ──────────────────────────
              # For Claude Desktop via the `mcp-remote` stdio bridge.
              # mcp-remote uses /oauth/callback (different path from
              # Claude Code's /callback). Same port (20202), different
              # path — keeps the two surfaces' OAuth tokens distinct,
              # so a desktop logout doesn't invalidate the CLI session.
              MCP_DESKTOP_FLAGS="--name Agentserver_MCP_Desktop \
                --grant-type authorization_code \
                --grant-type refresh_token \
                --response-type code \
                --scope openid --scope offline_access --scope mcp:read --scope mcp:exec \
                --redirect-uri http://localhost:20202/oauth/callback \
                --redirect-uri http://127.0.0.1:20202/oauth/callback \
                --token-endpoint-auth-method none \
                --audience https://mcp.{{ .Values.platform.domain }}/mcp"
              hydra update oauth2-client agentserver-mcp-desktop --endpoint "$ENDPOINT" $MCP_DESKTOP_FLAGS 2>/dev/null || \
              hydra create oauth2-client --endpoint "$ENDPOINT" --id agentserver-mcp-desktop $MCP_DESKTOP_FLAGS

              # Cleanup: drop the old combined `agentserver-mcp` client
              # if it still exists from earlier chart versions. Best-
              # effort; ignore not-found.
              hydra delete oauth2-client agentserver-mcp --endpoint "$ENDPOINT" 2>/dev/null || true
---
# --- Hydra Public Service ---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hydra-public
  labels:
    app.kubernetes.io/component: hydra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: hydra
  ports:
    - port: {{ .Values.hydra.publicPort }}
      targetPort: public
      name: public
---
# --- Hydra Admin Service ---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hydra-admin
  labels:
    app.kubernetes.io/component: hydra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: hydra
  ports:
    - port: {{ .Values.hydra.adminPort }}
      targetPort: admin
      name: admin
{{- end }}
