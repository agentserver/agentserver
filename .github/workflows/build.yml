      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Pull cc-app-gateway image (optimization)
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker pull ghcr.io/agentserver/cc-app-gateway:${SHORT_SHA} && \
            docker tag ghcr.io/agentserver/cc-app-gateway:${SHORT_SHA} cc-app-gateway:dev || \
            echo "image not available; integration test will build locally via make"

