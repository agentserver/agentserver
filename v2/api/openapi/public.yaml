          "workspaces:update": "Update a granted workspace",
          "workspaces:archive": "Archive a granted workspace",
          "members:read": "Read workspace members",
          "members:add": "Add a workspace member",
          "members:update": "Change a workspace member role",
          "members:remove": "Remove a workspace member",
          "executors:read": "Read workspace executor state",
          "executors:create": "Create a workspace executor identity",
          "executors:enroll": "Issue a workspace executor enrollment token",
          "executors:update": "Update workspace executor metadata",
          "executors:archive": "Archive a workspace executor",
          "llm-gateways:read": "Read workspace LLM Gateway configuration and the current user's grant status",
          "llm-gateways:create": "Create a workspace LLM Gateway",
          "llm-gateways:update": "Update a workspace LLM Gateway configuration",
          "llm-gateways:disable": "Disable a workspace LLM Gateway",
