name: Publish v2 Kubernetes Sandbox Artifacts
# DSH compilation is isolated; stock Codex 0.160.1 is qualified natively in SG.

on:
  workflow_dispatch:
    inputs:
      application_repair:
        type: choice
        options: [all, service, harness, runtime]
        default: all
        description: Rebuild selected images while retaining the other published components
      frontend_run_id:
        type: string
        default: ''
        description: Reuse the dsh-frontend artifact from this run (must have the same pinned frontend source/config)
      chart_only:
        type: boolean
        default: false
        description: Reuse published images for a configuration or network-policy-only chart release
  push:
    branches: [feat/botmux-native-oauth]
    paths: [".github/workflows/v2-kubernetes.yml"]

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: v2-kubernetes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    if: ${{ !inputs.frontend_run_id && !inputs.chart_only && !contains(github.event.head_commit.message, '[k8s chart]') }}
    uses: ./.github/workflows/dsh-frontend.yml
  gateway-probe-repair:
    if: ${{ contains(github.event.head_commit.message, '[k8s gateway]') }}
    runs-on: k8s-sg
    timeout-minutes: 15
    outputs:
      image: ${{ steps.repair.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and exercise the gateway TCP health helper
        id: repair
        run: |
          set -euo pipefail
          image="ghcr.io/agentserver/v2-k8s-gateway:probe-${GITHUB_SHA}"
          service_base=$(jq -er '.images.service' v2/deploy/production/kubernetes-published-images.json)
          gateway_base=$(jq -er '.images["k8s-gateway"]' v2/deploy/production/kubernetes-published-images.json)
          docker buildx build --platform linux/amd64 --load \
            --build-arg "SERVICE_BASE=$service_base" --build-arg "GATEWAY_BASE=$gateway_base" \
            --tag "$image" --file v2/deploy/production/kubernetes-gateway-repair.Containerfile v2/deploy/production
          status=0
          docker run --rm --entrypoint /usr/local/bin/agentserver-probe "$image" tcp --address=127.0.0.1:1 || status=$?
          test "$status" -eq 1
          for attempt in 1 2 3; do
            if docker push --quiet "$image"; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          printf 'image=%s\n' "$(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >>"$GITHUB_OUTPUT"
  node-profile-installer:
    if: ${{ !inputs.chart_only && !contains(github.event.head_commit.message, '[k8s chart]') && inputs.application_repair != 'runtime' && inputs.application_repair != 'service' && !contains(github.event.head_commit.message, '[k8s service]') && inputs.application_repair != 'harness' && !contains(github.event.head_commit.message, '[k8s harness]') }}
    runs-on: k8s-sg
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish bounded node profile installer
        run: |
          docker buildx build --platform linux/amd64 --push \
            --tag ghcr.io/agentserver/v2-k8s-profile-installer:nodeprofiles-${{ github.sha }} \
            --file v2/deploy/production/security/profile-installer.Containerfile \
            v2/deploy/production/security
  publish:
    needs: [gateway-probe-repair, frontend]
    if: ${{ !cancelled() && (needs.gateway-probe-repair.result == 'success' || needs.gateway-probe-repair.result == 'skipped') && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') }}
    runs-on: k8s-sg
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: go1.26.5
      GOFLAGS: -p=2
      HARNESS_BASE: ghcr.io/agentserver/v2-harness@sha256:0c98d8836c28d9574a739e7fc4e47ab437781cb7a14d64a1980c58d27533fa18
      CLI_BASE: ghcr.io/agentserver/v2-managed-sandbox@sha256:a34aacaab4fec47457b8a426e8d48370600c8096563f062c4b2bb743fea86e08
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Download frontend built from pinned DSH source
        if: ${{ !inputs.chart_only && !contains(github.event.head_commit.message, '[k8s chart]') }}
        uses: actions/download-artifact@v4
        with:
          name: dsh-frontend
          path: v2/dsh-web/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.frontend_run_id || github.run_id }}
      - name: Require built DSH artifacts for release tests
        if: ${{ !inputs.chart_only && !contains(github.event.head_commit.message, '[k8s chart]') }}
        run: echo 'AGENTSERVER_REQUIRE_DSH_ASSETS=1' >>"$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Configure private Go dependency read access
        env:
          CODE_BYTED_USERNAME: ${{ secrets.CODE_BYTED_USERNAME }}
          CODE_BYTED_TOKEN: ${{ secrets.CODE_BYTED_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CODE_BYTED_USERNAME" && test -n "$CODE_BYTED_TOKEN"
          umask 077
          git config --global credential.helper "store --file=${RUNNER_TEMP}/kubernetes-code-byted.credentials"
          printf 'protocol=https\nhost=code.byted.org\nusername=%s\npassword=%s\n\n' \
            "$CODE_BYTED_USERNAME" "$CODE_BYTED_TOKEN" | git credential approve
          printf '%s\n' 'GIT_TERMINAL_PROMPT=0' 'GOPRIVATE=code.byted.org' 'GONOSUMDB=code.byted.org' >>"$GITHUB_ENV"
      - name: Test services and Kubernetes provider
        if: ${{ !inputs.chart_only && !contains(github.event.head_commit.message, '[k8s chart]') }}
        run: |
          if ! command -v gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc libc6-dev
          fi
          go -C v2 test ./...
          go -C v2/providers/kubernetes vet ./...
          CGO_ENABLED=1 go -C v2/providers/kubernetes test -race ./...
      - name: Test chart-only changes
        if: ${{ inputs.chart_only || contains(github.event.head_commit.message, '[k8s chart]') }}
        run: go -C v2 test ./internal/productiondeploy
      - name: Verify quiet runtime commands survive the real HTTP2 write deadline
        if: ${{ inputs.application_repair == 'runtime' }}
        run: AGENTSERVER_RUN_RUNTIME_STREAM_TESTS=1 go -C v2 test ./internal/k8sruntime -run TestStreamWriteDeadlineDoesNotExpireBetweenFrames -count=1 -timeout=1m -v
      - name: Verify managed credential and pre-dispatch state transitions with PostgreSQL
        if: ${{ !inputs.chart_only && !contains(github.event.head_commit.message, '[k8s chart]') }}
        run: |
          set -euo pipefail
          test_database="agentserver-scope-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$test_database" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$test_database" \
            -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:55432:5432 postgres:17
          for attempt in $(seq 1 30); do
            if docker exec "$test_database" pg_isready -U postgres; then break; fi
            sleep 2
          done
          AGENTSERVER_RUN_POSTGRES_TESTS=1 \
          AGENTSERVER_V2_TEST_DATABASE_URL='postgres://postgres@127.0.0.1:55432/postgres?sslmode=disable' \
          go -C v2 test ./internal/coredb -count=1 \
            -run 'TestPostgreSQL(ManagedNotSentFailure|KubernetesByteCloudCredentialUsesProcessEnvironment|ByteCloudCredentialUsesProcessEnvironmentIndependentOfLarkMode|ExecutionCrashAfterDispatchCommitDoesNotAuthorizeReplay)'
      - name: Exercise stock Codex and previous-session upgrade on native Linux
        if: ${{ !inputs.chart_only && !contains(github.event.head_commit.message, '[k8s chart]') && inputs.application_repair != 'runtime' && inputs.application_repair != 'service' && !contains(github.event.head_commit.message, '[k8s service]') }}
        run: |
          set -euo pipefail
          runtime_dir="${RUNNER_TEMP}/codex-current-runtime"
          bash v2/deploy/production/prepare-kubernetes-codex.sh "$runtime_dir"
          previous_dir=$(mktemp -d)
          curl --fail --location --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.146.0/codex-x86_64-unknown-linux-musl.tar.gz \
            --output "$previous_dir/codex.tar.gz"
          tar -xzf "$previous_dir/codex.tar.gz" -C "$previous_dir"
          AGENTSERVER_RUN_LIVE_CODEX=1 \
          AGENTSERVER_CODEX_BIN="$runtime_dir/bundle/bin/codex" \
          AGENTSERVER_PREVIOUS_CODEX_BIN="$previous_dir/codex-x86_64-unknown-linux-musl" \
          go -C v2 test ./conformance/codex -count=1 -v \
            -run 'TestAppServer(A01|A03Dynamic|A07(Harness|InterruptClearsPendingDynamic)|A09|A11|ModelReceivesDecoded|TemporaryTitle|ProductionModel)'
          rm -- "$previous_dir/codex.tar.gz" "$previous_dir/codex-x86_64-unknown-linux-musl"
          rmdir "$previous_dir"
          printf 'CODEX_RUNTIME_DIRECTORY=%s\n' "$runtime_dir" >>"$GITHUB_ENV"
      - name: Download the previously deployed runtime configuration
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37485877306
          name: agentserver-v2-production-53e4f7f19848601fc6098579574c26ef1dd93594
          path: ${{ runner.temp }}/kubernetes-base
      - name: Release this disposable runner's test compilation cache before packaging
        if: ${{ !inputs.chart_only && !contains(github.event.head_commit.message, '[k8s chart]') }}
        run: go -C v2 clean -cache
      - name: Build and publish Kubernetes services and profile installer
        if: ${{ !inputs.chart_only && !contains(github.event.head_commit.message, '[k8s chart]') && inputs.application_repair != 'runtime' && inputs.application_repair != 'service' && !contains(github.event.head_commit.message, '[k8s service]') && inputs.application_repair != 'harness' && !contains(github.event.head_commit.message, '[k8s harness]') }}
        env:
          RELEASE_TAG: k8s-${{ github.sha }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/kubernetes-release
        run: bash v2/deploy/production/publish-kubernetes-images.sh
      - name: Publish application repair with qualified sandbox images unchanged
        if: ${{ inputs.application_repair == 'service' || inputs.application_repair == 'harness' || contains(github.event.head_commit.message, '[k8s service]') || contains(github.event.head_commit.message, '[k8s harness]') }}
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/kubernetes-release
          PUBLISH_HARNESS: ${{ inputs.application_repair == 'harness' || contains(github.event.head_commit.message, '[k8s harness]') }}
          CLEAN_BUILD_CACHE: 'true'
        run: bash v2/deploy/production/publish-kubernetes-service.sh
      - name: Publish runtime stream repair with qualified CLI and application images unchanged
        if: ${{ inputs.application_repair == 'runtime' }}
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/kubernetes-release
          CLEAN_BUILD_CACHE: 'true'
        run: bash v2/deploy/production/publish-kubernetes-runtime.sh
      - name: Reuse published images without rebuilding application binaries
        if: ${{ inputs.chart_only || contains(github.event.head_commit.message, '[k8s chart]') }}
        env:
          REPAIRED_GATEWAY_IMAGE: ${{ needs.gateway-probe-repair.outputs.image }}
          STAGE_SERVICE: ${{ contains(github.event.head_commit.message, '[k8s stage-service]') }}
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/kubernetes-release"
          mkdir -p "$release_dir"
          for kind in service harness k8s-runtime k8s-gateway k8s-profile-installer; do
            jq -er --arg kind "$kind" '.images[$kind]' \
              v2/deploy/production/kubernetes-published-images.json >"$release_dir/$kind.image"
          done
          if [ -n "$REPAIRED_GATEWAY_IMAGE" ]; then
            printf '%s\n' "$REPAIRED_GATEWAY_IMAGE" >"$release_dir/k8s-gateway.image"
          fi
          if [ "$STAGE_SERVICE" = true ]; then
            jq -er '.previousHarnessImage' v2/deploy/production/kubernetes-published-images.json >"$release_dir/harness.image"
          fi
      - name: Prepare active chart (does not deploy it)
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/kubernetes-release"
          mirror() { sed 's#^ghcr.io/#registry-sg.byted.cs.ac.cn/ghcr/#' "$release_dir/$1.image"; }
          go -C v2 run ./cmd/agentserver-kubernetes-release \
            --config="${RUNNER_TEMP}/kubernetes-base/agentserver-v2-release/production.json" \
            --output="$release_dir/production.json" \
            --service-image="$(mirror service)" --harness-image="$(mirror harness)" \
            --runtime-image="$(mirror k8s-runtime)" --gateway-image="$(mirror k8s-gateway)" \
            --environment-id=4e0e31cf-a8c9-4ef9-8197-71be586532df \
            --api-cidr=10.251.224.59/32 --all-workspaces --upgrade-codex
          go -C v2 run ./cmd/agentserver-deploy chart \
            --config="$release_dir/production.json" --output="$release_dir/chart"
          helm lint "$release_dir/chart" --namespace agentserver
          helm template agentserver-v2 "$release_dir/chart" --namespace agentserver >/dev/null
          helm package "$release_dir/chart" --destination "$release_dir"
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io --username '${{ github.actor }}' --password-stdin
          helm push "$release_dir"/agentserver-v2-*.tgz oci://ghcr.io/agentserver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentserver-v2-kubernetes-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kubernetes-release/*.image
            ${{ runner.temp }}/kubernetes-release/production.json
            ${{ runner.temp }}/kubernetes-release/*.tgz
          if-no-files-found: warn
      - name: Remove temporary dependency credential
        if: always()
        run: |
          git credential reject <<<'url=https://code.byted.org'
          git config --global --unset credential.helper || true
