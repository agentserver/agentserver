name: Publish v2 Kubernetes Sandbox Artifacts

on:
  workflow_dispatch:
  push:
    branches: [feat/botmux-native-oauth]
    paths: [".github/workflows/v2-kubernetes.yml"]

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: v2-kubernetes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: k8s-sg
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: go1.26.5
      HARNESS_BASE: ghcr.io/agentserver/v2-harness@sha256:0c98d8836c28d9574a739e7fc4e47ab437781cb7a14d64a1980c58d27533fa18
      CLI_BASE: ghcr.io/agentserver/v2-managed-sandbox@sha256:a34aacaab4fec47457b8a426e8d48370600c8096563f062c4b2bb743fea86e08
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Test services and Kubernetes provider
        run: |
          go -C v2 test ./...
          go -C v2/providers/kubernetes vet ./...
          go -C v2/providers/kubernetes test -race ./...
      - name: Download the previously deployed runtime configuration
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37485877306
          name: agentserver-v2-production-53e4f7f19848601fc6098579574c26ef1dd93594
          path: ${{ runner.temp }}/kubernetes-base
      - name: Build and publish independent Kubernetes images
        env:
          RELEASE_TAG: k8s-${{ github.sha }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/kubernetes-release
        run: bash v2/deploy/production/publish-kubernetes-images.sh
      - name: Prepare active chart (does not deploy it)
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/kubernetes-release"
          mirror() { sed 's#^ghcr.io/#registry-sg.byted.cs.ac.cn/ghcr/#' "$release_dir/$1.image"; }
          go -C v2 run ./cmd/agentserver-kubernetes-release \
            --config="${RUNNER_TEMP}/kubernetes-base/agentserver-v2-release/production.json" \
            --output="$release_dir/production.json" \
            --service-image="$(mirror service)" --harness-image="$(mirror harness)" \
            --runtime-image="$(mirror k8s-runtime)" --gateway-image="$(mirror k8s-gateway)" \
            --environment-id=4e0e31cf-a8c9-4ef9-8197-71be586532df \
            --api-cidr=10.251.224.59/32 --all-workspaces
          go -C v2 run ./cmd/agentserver-deploy chart \
            --config="$release_dir/production.json" --output="$release_dir/chart"
          helm lint "$release_dir/chart"
          helm template agentserver-v2 "$release_dir/chart" >/dev/null
          helm package "$release_dir/chart" --destination "$release_dir"
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io --username '${{ github.actor }}' --password-stdin
          helm push "$release_dir"/agentserver-v2-*.tgz oci://ghcr.io/agentserver
      - uses: actions/upload-artifact@v4
        with:
          name: agentserver-v2-kubernetes-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kubernetes-release/*.image
            ${{ runner.temp }}/kubernetes-release/production.json
            ${{ runner.temp }}/kubernetes-release/*.tgz
          if-no-files-found: error
