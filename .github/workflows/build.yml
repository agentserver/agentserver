name: Build and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  v2-unit:
    runs-on: k8s-sg
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: v2/go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verify v2 module boundary and unit tests
        run: make -C v2 check

  test:
    needs: [v2-unit]
    runs-on: k8s-sg
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install libolm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libolm-dev

      - name: Install agentx (for codexauth integration test)
        env:
          AGENTX_VERSION: v0.0.1
          # SHA-256 of agentx-x86_64-unknown-linux-musl.tar.gz at v0.0.1.
          # When bumping AGENTX_VERSION, update this from
          # https://github.com/agentserver/agentx/releases/download/<ver>/agentx-x86_64-unknown-linux-musl.tar.gz.sha256
          AGENTX_SHA256: 54d3ce874b30e52f78f8841f691c296bf0a7dcb8a5c14529cb4456ab9fad67de
        run: |
          set -euo pipefail
          tarball="agentx-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/agentserver/agentx/releases/download/${AGENTX_VERSION}/${tarball}"
          # Download the tarball directly (skipping install.sh) so we can
          # checksum-verify against a pinned SHA-256 before extracting.
          # Avoids `curl | sudo sh` of unpinned remote content in a CI
          # job that holds a write-scoped GITHUB_TOKEN.
          curl -fsSL "$url" -o "/tmp/$tarball"
          echo "${AGENTX_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/$tarball" -C /tmp
          sudo install -m 0755 "/tmp/agentx-x86_64-unknown-linux-musl/agentx" /usr/local/bin/agentx
          agentx --version 2>&1 | head

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 5m

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install web deps (for swagger2openapi)
        run: pnpm --dir web install --frozen-lockfile

      - name: Install swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: OpenAPI drift check
        run: make openapi-check

      - name: Install PyYAML (for API docs generator)
        run: python3 -m pip install --quiet pyyaml

      - name: API reference drift check
        run: make api-docs-check

  db-integration:
    # Runs narrowly scoped tests that require a real PostgreSQL (gated by
    # TEST_DATABASE_URL; otherwise t.Skip in test helpers). Broader db tests
    # have pre-existing FK-setup rot and need a separate cleanup pass before
    # they can all run in CI.
    runs-on: k8s-sg
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install libolm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libolm-dev

      - name: Scheduled tasks integration tests
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: go test ./internal/db/ -run '^TestScheduledTask' -count=1 -timeout 2m -v

      - name: Agent whoami integration tests
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: go test ./internal/server -run '^TestAgentWhoami' -count=1 -timeout 2m -v

      - name: MCP PAT integration tests
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: |
          go test ./internal/db/ -run '^TestMCPPAT' -count=1 -timeout 2m -v
          go test ./internal/server/ -run '^TestMCPPAT' -count=1 -timeout 2m -v

  build-server:
    runs-on: k8s-sg
    needs: [test, db-integration]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/agentserver/agentserver
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-opencode:
    runs-on: k8s-sg
    needs: [test]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2

      - name: Build opencode binary from submodule
        run: |
          cd opencode
          bun install --frozen-lockfile
          bun run --cwd packages/opencode build --single --skip-install
          cp packages/opencode/dist/opencode-linux-x64/bin/opencode ../opencode-bin
          chmod +x ../opencode-bin

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
