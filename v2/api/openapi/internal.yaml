{
  "openapi": "3.1.0",
  "info": {
    "title": "agentserver v2 internal command API",
    "version": "0.1.0",
    "description": "Run-dispatch, run-attempt, fenced run-launch state, brain tool catalog, executor enrollment/connection, environment registry, and execution state commands/queries. Every endpoint requires the explicitly authorized component workload identity."
  },
  "servers": [{"url": "https://agentserver-core"}],
  "security": [{"workloadMTLS": []}],
  "paths": {
    "/internal/v2/executor-enrollments:complete": {
      "post": {
        "operationId": "completeExecutorEnrollment",
        "description": "The executor-gateway relays one enrollment request and injects its configured single-executor binding. Core verifies that binding against the short-lived bearer before any database or Hydra mutation, then verifies possession of the Ed25519 connection-proof key and P-256 OAuth key, immutable runtime/environment fingerprint, and exact Hydra ES256 private_key_jwt client before changing the executor to offline.",
        "security": [{"workloadMTLS": [], "executorEnrollmentBearer": []}],
        "parameters": [{
          "name": "X-Agentserver-Expected-Executor-Id",
          "in": "header",
          "required": true,
          "description": "Gateway-configured executor deployment binding; never copied from the agentx request",
          "schema": {"$ref": "#/components/schemas/UUID"}
        }],
        "requestBody": {"required": true, "x-agentserver-maxBytes": 524288, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CompleteExecutorEnrollmentRequest"}}}},
        "responses": {
          "200": {"description": "Enrollment completed or exactly recovered", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CompleteExecutorEnrollmentResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "401": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"},
          "503": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/executor-connections:authorize": {
      "post": {
        "operationId": "authorizeExecutorConnection",
        "description": "Live-introspects an executor OAuth bearer, resolves its current non-revoked enrolled machine identity, and reconciles the exact Hydra P-256 client document. The bearer is sent only in Authorization and the request body is empty.",
        "security": [{"workloadMTLS": [], "executorOAuthBearer": ["executor:connect"]}],
        "responses": {
          "200": {"description": "Current machine authority for a subsequent nonce challenge or WSS proof", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthorizeExecutorConnectionResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "503": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/run-dispatches:claim": {
      "post": {
        "operationId": "claimRunDispatches",
        "description": "Long-polls and generation-fences the scheduler-only run.queued outbox lane.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClaimRunDispatchesRequest"}}}},
        "responses": {
          "200": {"description": "Zero or more claimed queued-run facts", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClaimRunDispatchesResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/run-dispatches/{runDispatchId}:complete": {
      "parameters": [{"$ref": "#/components/parameters/RunDispatchId"}],
      "post": {
        "operationId": "completeRunDispatch",
        "description": "Completes a claimed dispatch only after its run crossed turn acceptance or became terminal.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CompleteRunDispatchRequest"}}}},
        "responses": {
          "200": {"description": "Dispatch completed or already completed", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CompleteRunDispatchResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/run-dispatches/{runDispatchId}:release": {
      "parameters": [{"$ref": "#/components/parameters/RunDispatchId"}],
      "post": {
        "operationId": "releaseRunDispatch",
        "description": "Releases the exact live dispatch claim with a bounded database-clock retry delay.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReleaseRunDispatchRequest"}}}},
        "responses": {
          "200": {"description": "Dispatch released or already completed", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReleaseRunDispatchResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/run-attempts:claim": {
      "post": {
        "operationId": "claimRunAttempt",
        "description": "Claims one known queued run and atomically creates its generation-scoped session and attempt leases.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClaimRunAttemptRequest"}}}},
        "responses": {
          "200": {"description": "Fresh claim, exact retry, or eligible pre-turn reclaim", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClaimRunAttemptResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/run-attempts/{runAttemptId}:renew": {
      "parameters": [{"$ref": "#/components/parameters/RunAttemptId"}],
      "post": {
        "operationId": "renewRunAttempt",
        "description": "Renews the exact session and attempt lease tuple in one database transaction.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RenewRunAttemptRequest"}}}},
        "responses": {
          "200": {"description": "Both holder leases renewed", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RenewRunAttemptResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/run-attempts/{runAttemptId}:interrupt": {
      "parameters": [{"$ref": "#/components/parameters/RunAttemptId"}],
      "post": {
        "operationId": "interruptRunAttempt",
        "description": "After the exact holder has stopped a cancelling attempt at a safe boundary, atomically marks the attempt interrupted, marks the run cancelled, clears the active session and both leases, and emits run.cancelled.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/InterruptRunAttemptRequest"}}}},
        "responses": {
          "200": {"description": "Cancellation terminal committed or exact retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/InterruptRunAttemptResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/run-attempts/{runAttemptId}:commitTerminal": {
      "parameters": [{"$ref": "#/components/parameters/RunAttemptId"}],
      "post": {
        "operationId": "commitAttemptTerminal",
        "description": "After the exact holder has stopped an accepted stock turn that ended failed or interrupted, atomically commits the non-success terminal, or closes a cancellation that raced with cleanup, then clears the active session and both leases.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CommitAttemptTerminalRequest"}}}},
        "responses": {
          "200": {"description": "Non-success terminal committed or exact retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CommitAttemptTerminalResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/run-attempts/{runAttemptId}:abandon": {
      "parameters": [{"$ref": "#/components/parameters/RunAttemptId"}],
      "post": {
        "operationId": "abandonRunAttempt",
        "description": "After the exact holder has stopped a pre-turn workload, atomically requeues a transient failure, fails a deterministic startup rejection, or closes a cancellation that raced with cleanup, then removes both leases.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AbandonRunAttemptRequest"}}}},
        "responses": {
          "200": {"description": "Stopped pre-turn attempt was reconciled or exact retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AbandonRunAttemptResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/run-attempts/{runAttemptId}:turnAccepted": {
      "parameters": [{"$ref": "#/components/parameters/RunAttemptId"}],
      "post": {
        "operationId": "markTurnAccepted",
        "description": "Crosses the no-automatic-retry boundary after stock app-server accepted the turn.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MarkTurnAcceptedRequest"}}}},
        "responses": {
          "200": {"description": "Turn acceptance committed or exact terminal retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MarkTurnAcceptedResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/run-attempts/{runAttemptId}:beginFinalization": {
      "parameters": [{"$ref": "#/components/parameters/RunAttemptId"}],
      "post": {
        "operationId": "beginRunFinalization",
        "description": "Freezes the completed terminal thread and turn under the live holder lease after the complete attempt process group has stopped.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BeginRunFinalizationRequest"}}}},
        "responses": {
          "200": {"description": "Finalization boundary committed or exact terminal retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BeginRunFinalizationResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/run-attempts/{runAttemptId}:commitCheckpoint": {
      "parameters": [{"$ref": "#/components/parameters/RunAttemptId"}],
      "post": {
        "operationId": "commitCheckpointAndTerminalRun",
        "description": "Atomically makes an already uploaded checkpoint reachable, completes the run, updates the session resume pointer, emits run.completed, and removes both holder leases.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CommitCheckpointRequest"}}}},
        "responses": {
          "200": {"description": "Checkpoint and terminal run committed or exact checkpoint retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CommitCheckpointResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/run-attempts/{runAttemptId}/events:append": {
      "parameters": [{"$ref": "#/components/parameters/RunAttemptId"}],
      "post": {
        "operationId": "appendAttemptEvents",
        "description": "Appends a bounded same-producer batch and allocates authoritative run sequence numbers.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AppendAttemptEventsRequest"}}}},
        "responses": {
          "200": {"description": "Per-producer identities mapped to authoritative run sequence numbers", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AppendAttemptEventsResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/run-launch-states:resolve": {
      "post": {
        "operationId": "resolveRunLaunchState",
        "description": "Returns the immutable prompt, compatible committed checkpoint, and executor tool-policy projection only for the exact live pre-turn attempt authority tuple.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ResolveRunLaunchStateRequest"}}}},
        "responses": {
          "200": {"description": "Fenced launch authority projection", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ResolveRunLaunchStateResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/brain-tool-catalogs:freeze": {
      "post": {
        "operationId": "freezeBrainToolCatalog",
        "description": "Freezes the exact model-visible executor tool catalog under the live pre-turn run-attempt authority tuple.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FreezeBrainToolCatalogRequest"}}}},
        "responses": {
          "200": {"description": "Catalog created or exact immutable retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FreezeBrainToolCatalogResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/brain-tool-catalogs/{catalogId}:bindThread": {
      "parameters": [{"$ref": "#/components/parameters/CatalogId"}],
      "post": {
        "operationId": "bindBrainThreadCatalog",
        "description": "CAS-binds the frozen catalog to the exact thread returned by stock app-server; an existing thread binding is immutable.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BindBrainThreadCatalogRequest"}}}},
        "responses": {
          "200": {"description": "Thread binding committed or exact retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BindBrainThreadCatalogResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/executor-connections:acquire": {
      "post": {
        "operationId": "acquireExecutorConnection",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {"schema": {"$ref": "#/components/schemas/AcquireExecutorConnectionRequest"}}
          }
        },
        "responses": {
          "200": {"description": "Fresh generation acquired or exact current attempt returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ExecutorConnectionResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/executor-environments:list": {
      "post": {
        "operationId": "listExecutorEnvironments",
        "description": "Returns only online environments backed by a live database-clock connection lease.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ListExecutorEnvironmentsRequest"}}}},
        "responses": {
          "200": {"description": "Bounded online environment registry", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ListExecutorEnvironmentsResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/executions:prepare": {
      "post": {
        "operationId": "prepareExecution",
        "description": "Freezes one model tool call and its validated canonical execution context. Core computes all digests from the supplied JSON values.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PrepareExecutionRequest"}}}},
        "responses": {
          "200": {"description": "Execution created or exact tool-call retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PrepareExecutionResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/executions/{executionId}/operations:prepare": {
      "parameters": [{"$ref": "#/components/parameters/ExecutionId"}],
      "post": {
        "operationId": "prepareOperation",
        "description": "Persists one member of the frozen deterministic operation plan before dispatch.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PrepareOperationRequest"}}}},
        "responses": {
          "200": {"description": "Operation prepared or exact ordinal retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PrepareOperationResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/executions/{executionId}/operations/{operationId}:begin-dispatch": {
      "parameters": [{"$ref": "#/components/parameters/ExecutionId"}, {"$ref": "#/components/parameters/OperationId"}],
      "post": {
        "operationId": "beginOperationDispatch",
        "description": "Crosses the one-shot external-send boundary. Only a response with began=true permits the caller to send the operation.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BeginOperationDispatchRequest"}}}},
        "responses": {
          "200": {"description": "Dispatch boundary result; exact retry always has began=false", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BeginOperationDispatchResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/executions/{executionId}/operations/{operationId}:acknowledge": {
      "parameters": [{"$ref": "#/components/parameters/ExecutionId"}, {"$ref": "#/components/parameters/OperationId"}],
      "post": {
        "operationId": "acknowledgeOperation",
        "description": "Commits agentx mutation acceptance or equivalent trusted acknowledgement evidence. A WSS frame ACK is not sufficient.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AcknowledgeOperationRequest"}}}},
        "responses": {
          "200": {"description": "Acknowledgement committed or exact evidence retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AcknowledgeOperationResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/executions/{executionId}/operations/{operationId}:complete": {
      "parameters": [{"$ref": "#/components/parameters/ExecutionId"}, {"$ref": "#/components/parameters/OperationId"}],
      "post": {
        "operationId": "completeOperation",
        "description": "Commits terminal operation evidence. An unacknowledged dispatch may close only as unknown.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CompleteOperationRequest"}}}},
        "responses": {
          "200": {"description": "Operation terminal state committed or exact retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CompleteOperationResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/executions/{executionId}/operations/{operationId}:skip": {
      "parameters": [{"$ref": "#/components/parameters/ExecutionId"}, {"$ref": "#/components/parameters/OperationId"}],
      "post": {
        "operationId": "skipOperation",
        "description": "Closes a trailing optional timeout operation without crossing the dispatch boundary, after every preceding operation is terminal.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SkipOperationRequest"}}}},
        "responses": {
          "200": {"description": "Optional operation skipped or exact skip retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SkipOperationResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/executions/{executionId}:complete": {
      "parameters": [{"$ref": "#/components/parameters/ExecutionId"}],
      "post": {
        "operationId": "completeExecution",
        "description": "Commits the terminal execution state after core verifies the aggregate of every frozen operation.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CompleteExecutionRequest"}}}},
        "responses": {
          "200": {"description": "Execution terminal state committed or exact retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CompleteExecutionResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/managed-sandboxes:reserve": {
      "post": {
        "operationId": "reserveManagedSandbox",
        "description": "Serializes the session/environment identity and reserves exactly one active managed sandbox generation. Exact profile retries return the existing generation.",
        "requestBody": {"required": true, "x-agentserver-maxBytes": 262144, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReserveManagedSandboxRequest"}}}},
        "responses": {
          "200": {"description": "Managed sandbox generation reserved or exact ensure retry returned", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReserveManagedSandboxResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"},
          "404": {"$ref": "#/components/responses/CommandError"},
          "409": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/managed-sandboxes:reconcile": {
      "post": {
        "operationId": "listManagedSandboxesForReconcile",
        "description": "Returns bounded non-converged, expired, or idle managed sandbox generations for sandbox-gateway reconciliation.",
        "requestBody": {"required": true, "x-agentserver-maxBytes": 262144, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ListManagedSandboxesForReconcileRequest"}}}},
        "responses": {
          "200": {"description": "Managed sandbox reconciliation candidates", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ListManagedSandboxesForReconcileResponse"}}}},
          "400": {"$ref": "#/components/responses/CommandError"},
          "403": {"$ref": "#/components/responses/CommandError"}
        }
      }
    },
    "/internal/v2/managed-sandboxes/{sandboxId}": {
      "parameters": [{"$ref": "#/components/parameters/SandboxId"}],
      "get": {
        "operationId": "getManagedSandbox",
        "parameters": [{"name": "generation", "in": "query", "required": true, "schema": {"type": "integer", "minimum": 1, "maximum": 9007199254740991}}],
